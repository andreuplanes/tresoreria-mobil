<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Tresoreria">
<meta name="theme-color" content="#24324a"><meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png">
<title>Tresoreria Mòbil · v2.0</title>
<!-- ═══════════════════════════════════════════════════════════════════════════
  PANELL · TRESORERIA MÒBIL · v2.0 (13/10/2026) · ENTRADA
  · v2: les Tresoreries d'ESCRIPTORI senceres al mòbil (totes les pestanyes), muntades amb munta2.py a partir dels fitxers de
    l'ordinador: només canvia on es llegeix i es desa (Dropbox en lloc del disc del PANELL) i la pantalla. Les dues tresoreries
    van sempre sincronitzades amb les de l'ordinador: quan es canvien, es tornen a muntar.
  · Aquesta pàgina: connectar amb Dropbox (una vegada per aparell) i triar l'empresa.
  · Mode de dades: cuina (cuina → …_rev.html i dades _rev.json; patrimoni → dades de patrimoni). Totes a cuina o totes a
    patrimoni, com les apps de l'ordinador.
  HISTÒRIA
    v2.0 (13/10/2026) — Les dues Tresoreries d'escriptori senceres al mòbil (Andreu: «el més semblant possible a la d'escriptori»).
    v1.1 / v1.0 (13/10/2026) — Versió reduïda (pendents, factures, moviments, cobrar i pagar).
═══════════════════════════════════════════════════════════════════════════ -->
<style>
:root{ --ink:#1b2431; --muted:#647089; --accent:#3d5a80; --neg:#b3382f; }
*{box-sizing:border-box} html,body{margin:0; min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#24324a; color:var(--ink); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
.caixa{background:#fff; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,.3); padding:20px 22px 16px; width:100%; max-width:560px}
h1{margin:0 0 2px; font-size:20px} .sub{color:var(--muted); font-size:13px} p{margin:8px 0 14px; color:var(--muted); font-size:14px}
.btn{border:1px solid #cbd4e1; background:#fff; color:var(--ink); padding:10px 16px; border-radius:9px; font-size:15px; font-weight:650; cursor:pointer}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
.emps{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0 6px}
.emp{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:22px 10px; border-radius:12px; background:#3d5a80; color:#fff; text-decoration:none; font-weight:800; font-size:19px; letter-spacing:.4px}
.emp span{font-weight:500; font-size:12px; opacity:.8; letter-spacing:0}
.emp.r{background:#5b4a3a}
.peu{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap}
.cuina{display:inline-block; background:#f59e0b; color:#3a2a00; font-weight:800; font-size:11px; letter-spacing:.6px; border-radius:6px; padding:3px 7px; vertical-align:middle; margin-left:6px}
.pant{display:none} .pant.on{display:block}
.field{margin:10px 0} .field label{display:block; font-size:12px; font-weight:650; color:var(--muted); margin-bottom:4px}
.field input,.field select{width:100%; font-size:16px; padding:9px 10px; border:1px solid #cbd4e1; border-radius:8px}
.err{color:var(--neg); font-size:13px; min-height:16px}
</style>
</head>
<body>
<div class="caixa">
  <div style="display:flex; align-items:center; gap:10px"><img src="icon.png" alt="" style="width:44px;height:44px;border-radius:10px">
    <div><h1>Tresoreria Mòbil<span class="cuina" id="eCuina" style="display:none">CUINA</span></h1><div class="sub" id="eVer"></div></div></div>

  <div class="pant" id="pConnecta">
    <p>Connecta aquest aparell amb el teu Dropbox (només el primer cop). Només s'hi pot connectar el compte <b>andreuplanes@gmail.com</b>.</p>
    <div class="peu"><button class="btn ghost" data-cfg>⚙ Configuració</button><button class="btn primary" id="bEntra">Connectar amb Dropbox</button></div>
  </div>

  <div class="pant" id="pTria">
    <p style="margin-bottom:0">Tria l'empresa. Et demanarà la contrasenya de gestió.</p>
    <div class="emps">
      <a class="emp" id="aCris" href="#">CRISANGLASS<span>Tresoreria</span></a>
      <a class="emp r" id="aRou" href="#">ROURES<span>Tresoreria</span></a>
    </div>
    <div class="peu"><span class="sub" id="eCompte"></span><button class="btn ghost" data-cfg>⚙</button></div>
  </div>

  <div class="pant" id="pCfg">
    <div class="field"><label>Clau de l'app de Dropbox («App key»)</label><input id="cClau" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <div class="field"><label>Carpeta del PANELL a Dropbox</label><input id="cArrel" autocapitalize="off" autocorrect="off"></div>
    <div class="field"><label>Bloquejar sola després de (minuts sense tocar-la)</label><select id="cMin"><option>2</option><option>5</option><option>10</option><option>15</option></select></div>
    <p class="sub" id="cInfo"></p>
    <div class="peu"><button class="btn ghost" id="cSurt" style="color:var(--neg)">Desconnectar Dropbox</button><span><button class="btn" id="cTorna">Tornar</button> <button class="btn primary" id="cDesa">Desar</button></span></div>
  </div>
  <div class="err" id="eErr"></div>
</div>
<script>
var APP_VERSION='v2.0', MODE='cuina';
/* Al PANELL (localhost): el mode el diu el camí (_cuina / _estables) i les pàgines porten el prefix gestio_tresoreria_mobil_ */
var LOCAL=/\/apps\/gestio\//i.test(location.pathname);
/* v2.0 · Al PANELL (ordinador) es veu DINS D'UN IPHONE: aquesta mateixa pàgina, amb ?dins=1, dins d'un marc de mòbil */
var DINS=new URLSearchParams(location.search).has('dins') || window.top!==window.self;
if(LOCAL) MODE=/\/_cuina\//i.test(location.pathname)?'cuina':'patrimoni';
var APP_KEY_DEFECTE='ntd7gdp1oqu7whl', ARREL_DEFECTE='/PANELL', USUARIS_PERMESOS=['andreuplanes@gmail.com'];
var PRE = LOCAL ? 'gestio_tresoreria_mobil_' : '', SUF = MODE==='cuina' ? '_rev.html' : '.html';
var PAGINES = { cris:PRE+'crisanglass'+SUF, rou:PRE+'roures'+SUF };
function $(id){ return document.getElementById(id); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
var CFG={ clau:lsGet('tm.clau',APP_KEY_DEFECTE)||APP_KEY_DEFECTE, arrel:lsGet('tm.arrel',ARREL_DEFECTE), min:+lsGet('tm.min','5')||5 };
var REDIRECT=location.origin+location.pathname, TOKEN={access:null,refresh:null,exp:0};
try{ TOKEN=JSON.parse(lsGet('tm.token','null'))||TOKEN; }catch(e){}
var _de='pConnecta';
function mostra(id){ document.querySelectorAll('.pant').forEach(function(p){ p.classList.toggle('on', p.id===id); }); }
function b64url(buf){ var u=new Uint8Array(buf), s=''; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function entra(){
  var verif=b64url(crypto.getRandomValues(new Uint8Array(48))); sessionStorage.setItem('tm.verif', verif);
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(verif)).then(function(h){
    (window.top||window).location.href='https://www.dropbox.com/oauth2/authorize?client_id='+encodeURIComponent(CFG.clau)+'&response_type=code&code_challenge='+b64url(h)+'&code_challenge_method=S256&redirect_uri='+encodeURIComponent(REDIRECT)+'&token_access_type=offline'; });
}
function tokenPost(params){ return fetch('https://api.dropboxapi.com/oauth2/token',{ method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(params) })
  .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error_description||j.error||('HTTP '+r.status)); return j; }); }); }
function accessToken(){
  if(TOKEN.access && Date.now()<TOKEN.exp) return Promise.resolve(TOKEN.access);
  if(!TOKEN.refresh) return Promise.reject(new Error('cal connectar amb Dropbox'));
  return tokenPost({ grant_type:'refresh_token', refresh_token:TOKEN.refresh, client_id:CFG.clau }).then(function(j){ TOKEN.access=j.access_token; TOKEN.exp=Date.now()+(j.expires_in||14400)*1000-60000; lsSet('tm.token',JSON.stringify(TOKEN)); return TOKEN.access; });
}
function desconnecta(){ TOKEN={access:null,refresh:null,exp:0}; lsSet('tm.token',null); lsSet('tm.compte',null); mostra('pConnecta'); }
$('bEntra').onclick=entra;
document.querySelectorAll('[data-cfg]').forEach(function(b){ b.onclick=function(){ _de=document.querySelector('.pant.on').id; $('cClau').value=CFG.clau; $('cArrel').value=CFG.arrel; $('cMin').value=String(CFG.min);
  $('cInfo').innerHTML='Versió <b>'+APP_VERSION+'</b> · dades de <b>'+(MODE==='cuina'?'CUINA (_rev.json)':'PATRIMONI')+'</b><br>Adreça per a les «Redirect URIs» de Dropbox:<br><b>'+REDIRECT+'</b>'; mostra('pCfg'); }; });
$('cTorna').onclick=function(){ mostra(_de); };
$('cDesa').onclick=function(){ CFG.clau=$('cClau').value.trim()||APP_KEY_DEFECTE; CFG.arrel=$('cArrel').value.trim()||ARREL_DEFECTE; CFG.min=+$('cMin').value||5;
  lsSet('tm.clau',CFG.clau); lsSet('tm.arrel',CFG.arrel); lsSet('tm.min',String(CFG.min)); mostra(_de); };
$('cSurt').onclick=function(){ if(confirm('Desconnectar aquest aparell del Dropbox?')) desconnecta(); };
$('aCris').href=PAGINES.cris; $('aRou').href=PAGINES.rou;
$('eVer').textContent=APP_VERSION+(MODE==='cuina'?' · dades de cuina':''); $('eCuina').style.display=MODE==='cuina'?'':'none';
/* Marc d'iPhone (només al PANELL, a l'ordinador): horitzontal o vertical, ajustat a la finestra */
function muntaMarc(){
  var hz=lsGet('tm.marcVert','0')!=='1';
  document.body.innerHTML='<div id="mBarra" style="position:fixed;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;color:#fff;font-size:13px;z-index:5">'+
    '<b>Tresoreria Mòbil '+APP_VERSION+'</b><span style="opacity:.75">· simulació iPhone'+(MODE==='cuina'?' · dades de CUINA':'')+'</span>'+
    '<button id="mGira" style="border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer">⟲ Girar</button></div>'+
    '<div id="mMarc" style="position:relative;background:#0d0f14;border-radius:46px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 0 0 2px #3a3f4a;transform-origin:center center">'+
    '<iframe id="mIf" src="'+location.pathname+'?dins=1" style="display:block;border:0;border-radius:34px;background:#fff"></iframe></div>';
  document.body.style.cssText='margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1c2433;overflow:hidden';
  function posa(){ var W=hz?844:390, H=hz?390:844, f=document.getElementById('mIf'), m=document.getElementById('mMarc');
    f.style.width=W+'px'; f.style.height=H+'px';
    var esc=Math.min(1,(window.innerWidth-40)/(W+28),(window.innerHeight-70)/(H+28)); m.style.transform='scale('+esc+')'; }
  document.getElementById('mGira').onclick=function(){ hz=!hz; lsSet('tm.marcVert',hz?'0':'1'); posa(); };
  window.addEventListener('resize',posa); posa();
}
(function(){
  var qs=new URLSearchParams(location.search), code=qs.get('code'), err=qs.get('error_description')||qs.get('error');
  if(err){ $('eErr').textContent='Dropbox: '+err; history.replaceState(null,'',REDIRECT); }
  var p=Promise.resolve();
  if(code){ var verif=sessionStorage.getItem('tm.verif');
    p=tokenPost({ code:code, grant_type:'authorization_code', code_verifier:verif, client_id:CFG.clau, redirect_uri:REDIRECT }).then(function(j){
      TOKEN={ access:j.access_token, refresh:j.refresh_token||null, exp:Date.now()+(j.expires_in||14400)*1000-60000 }; lsSet('tm.token',JSON.stringify(TOKEN)); sessionStorage.removeItem('tm.verif'); history.replaceState(null,'',REDIRECT); }); }
  p.then(function(){
    /* a l'ordinador (PANELL, o GitHub obert amb ratolí en una pantalla gran) es veu dins d'un iPhone */
    if(!DINS && (LOCAL || (window.matchMedia && matchMedia('(pointer:fine)').matches && window.innerWidth>1000))){ muntaMarc(); return; }
    if(!TOKEN.refresh && !TOKEN.access){ mostra('pConnecta'); return; }
    return accessToken().then(function(t){ return fetch('https://api.dropboxapi.com/2/users/get_current_account',{ method:'POST', headers:{ Authorization:'Bearer '+t } }); })
      .then(function(r){ if(!r.ok) throw new Error('Dropbox: HTTP '+r.status); return r.json(); }).then(function(a){
        var mail=(a&&a.email||'').toLowerCase(); lsSet('tm.compte',mail);
        if(USUARIS_PERMESOS.indexOf(mail)<0){ alert('Aquest compte de Dropbox ('+mail+') no pot fer servir la Tresoreria.'); desconnecta(); return; }
        $('eCompte').textContent=mail; mostra('pTria'); });
  }).catch(function(e){ $('eErr').textContent='⚠ '+(e&&e.message||e); mostra(TOKEN.refresh?'pTria':'pConnecta'); });
})();
</script>
</body>
</html>
