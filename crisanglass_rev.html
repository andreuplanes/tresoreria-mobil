/* ============================================================
   MOTOR edicioRapida — edició en taula reutilitzable.
   cfg: { titol, dades[], idField, sortBy, camps[{id,etiqueta,tipus,editable,opcions,crearTipus,locDefault,editDefault}], desar, onEdit? }
   ============================================================ */
function edicioRapida(cfg){
  var loc={}, edit={}, idf=cfg.idField;
  cfg.camps.forEach(function(c){ if(c.locDefault) loc[c.id]=true; if(c.editDefault) edit[c.id]=true; });
  var sortBy=cfg.sortBy||(cfg.camps[0]&&cfg.camps[0].id), sortDir=cfg.sortDir||1;
  var sel={}; cfg.dades.forEach(function(r){ sel[r[idf]]=true; });
  var q="", fTercerSel=cfg.initTercer||"";
  openModal('<h3>'+esc(cfg.titol)+'</h3><div id="er-host"></div><div class="foot"><button class="btn ghost" id="er-tancar">Tancar</button></div>', {wide:true});
  var host=document.getElementById("er-host");
  document.getElementById("er-tancar").onclick=function(){ if(cfg.syncBack) cfg.syncBack(fTercerSel); closeModal(); render(); };
  draw();

  function optsOf(c){ return typeof c.opcions==="function"? c.opcions() : (c.opcions||[]); }
  function fmtLoc(c,v,r){ if(c.locRender) return c.locRender(v,r); if(v==null||v==="") return '<span class="sub">—</span>'; if(c.tipus==="num") return eur(v); if(c.tipus==="data") return fdate(v); return esc(String(v)); }
  function cellHTML(c,r){
    var v=r[c.id]==null?"":r[c.id];
    if(c.tipus==="llista"){
      var ops=optsOf(c), h='<select class="er-cell" data-field="'+c.id+'" data-id="'+r[idf]+'"><option value=""></option>';
      ops.forEach(function(o){ h+='<option value="'+esc(o)+'" '+(String(o)===String(v)?"selected":"")+'>'+esc(o)+'</option>'; });
      if(String(v)!=="" && ops.map(String).indexOf(String(v))<0) h+='<option value="'+esc(v)+'" selected>'+esc(v)+'</option>';
      if(c.crearTipus) h+='<option value="__NOU__">➕ Generar nova…</option>';
      return h+'</select>';
    }
    var type=c.tipus==="data"?"date":(c.tipus==="num"?"number":"text");
    return '<input class="er-cell" type="'+type+'" '+(c.tipus==="num"?'step="0.01"':'')+' data-field="'+c.id+'" data-id="'+r[idf]+'" value="'+esc(String(v))+'">';
  }
  function draw(){
    var locCols=cfg.camps.filter(function(c){return loc[c.id];});
    var editCols=cfg.camps.filter(function(c){return edit[c.id];});
    var ql=q.toLowerCase();
    var rows=cfg.dades.filter(function(r){
      if(cfg.cercaCamp){
        if(fTercerSel){ if(String(r[cfg.cercaCamp]||"")!==fTercerSel) return false; }
        else if(ql){ if(String(r[cfg.cercaCamp]||"").toLowerCase().indexOf(ql)<0) return false; }
      }
      return sel[r[idf]];
    });
    if(sortBy){ rows=rows.slice().sort(function(a,b){ var x=a[sortBy], y=b[sortBy]; x=x==null?"":x; y=y==null?"":y; return (x<y?-1:x>y?1:0)*sortDir; }); }
    var h='';
    if(cfg.cercaCamp||cfg.ordres){
      h+='<div class="er-filterbar">';
      if(cfg.cercaCamp){
        var suggs=[];
        if(ql && !fTercerSel){ var cc={}; cfg.dades.forEach(function(r){ var v=r[cfg.cercaCamp]; if(v && String(v).toLowerCase().indexOf(ql)>=0) cc[v]=(cc[v]||0)+1; }); suggs=Object.keys(cc).sort().slice(0,10).map(function(n){return {nom:n,n:cc[n]};}); }
        h+='<span class="searchwrap"><input type="text" class="search" id="er-cerca" placeholder="'+esc(cfg.cercaLabel||"Cerca…")+'" value="'+esc(q)+'" autocomplete="off">'+
          (suggs.length?('<div class="suggest">'+suggs.map(function(s){return '<div class="suggest-item" data-ersug="'+esc(s.nom)+'">'+esc(s.nom)+' <span class="sub">'+s.n+'</span></div>';}).join('')+'</div>'):'')+'</span>';
        if(fTercerSel) h+='<span class="chip2">'+esc(fTercerSel)+' <button class="chipx" id="er-clearsug">✕</button></span>';
      }
      if(cfg.ordres){ h+='<span class="sub" style="margin-left:4px">Ordena:</span><select class="filter" id="er-ordre">'+cfg.ordres.map(function(o){return '<option value="'+o.id+'" '+(sortBy===o.id?"selected":"")+'>'+esc(o.label)+'</option>';}).join('')+'</select><button class="btn ghost sm" id="er-ordredir">'+(sortDir>0?"▲":"▼")+'</button>'; }
      h+='</div>';
    }
    h+='<div class="er-selbar"><div class="er-selrow"><span class="lab">📌 Localitzar</span>'+
      cfg.camps.map(function(c){ return '<label class="er-chip loc '+(loc[c.id]?"on":"")+'"><input type="checkbox" data-erloc="'+c.id+'" '+(loc[c.id]?"checked":"")+'>'+esc(c.etiqueta)+'</label>'; }).join('')+'</div>'+
      '<div class="er-selrow"><span class="lab">✏️ Editar</span>'+
      cfg.camps.map(function(c){ var dis=c.editable===false; return '<label class="er-chip edit '+(edit[c.id]?"on":"")+'" style="'+(dis?"opacity:.3;cursor:not-allowed":"")+'"><input type="checkbox" data-eredit="'+c.id+'" '+(edit[c.id]?"checked":"")+' '+(dis?"disabled":"")+'>'+esc(c.etiqueta)+'</label>'; }).join('')+'</div></div>';
    h+='<div class="er-tools"><button class="btn ghost sm" id="er-all">Totes</button><button class="btn ghost sm" id="er-none">Cap</button><span class="sub">'+rows.length+' files · '+editCols.length+' columnes editables</span><span class="er-status" id="er-status">✓ desat</span></div>';
    h+='<div class="er-wrap"><table><thead><tr><th></th>';
    locCols.forEach(function(c){ h+='<th class="sortable" data-ersort="'+c.id+'">'+esc(c.etiqueta)+(sortBy===c.id?(sortDir>0?" ▲":" ▼"):"")+'</th>'; });
    editCols.forEach(function(c){ h+='<th>✏️ '+esc(c.etiqueta)+'</th>'; });
    h+='</tr></thead><tbody>';
    if(!rows.length) h+='<tr><td colspan="30" class="sub" style="padding:16px">Cap fila. Marca camps a Editar i files a mostrar.</td></tr>';
    rows.forEach(function(r){
      h+='<tr><td style="width:30px;text-align:center"><input type="checkbox" data-ersel="'+r[idf]+'" checked></td>';
      locCols.forEach(function(c){ h+='<td class="loccell '+(c.tipus==="num"?"num":"")+'">'+fmtLoc(c,r[c.id],r)+'</td>'; });
      editCols.forEach(function(c){ h+='<td>'+cellHTML(c,r)+'</td>'; });
      h+='</tr>';
    });
    h+='</tbody></table></div>';
    host.innerHTML=h; wire(editCols.length);
  }
  function commit(el){
    var id=el.getAttribute("data-id"), field=el.getAttribute("data-field");
    var rec=cfg.dades.filter(function(r){return String(r[idf])===String(id);})[0]; if(!rec) return;
    var camp=cfg.camps.filter(function(c){return c.id===field;})[0], nv=el.value;
    if(camp&&camp.tipus==="num"){ nv=nv===""?null:parseFloat(nv); if(nv!==null&&isNaN(nv)) return; }
    else { nv=(nv==null?"":nv); if(camp&&camp.tipus==="text") nv=nv.trim(); }
    if(String(rec[field]==null?"":rec[field])!==String(nv==null?"":nv)){
      rec[field]=nv; if(cfg.onEdit) cfg.onEdit(rec,field); cfg.desar();
      var td=el.closest("td"); if(td){ td.classList.remove("er-saved"); void td.offsetWidth; td.classList.add("er-saved"); }
      var s=host.querySelector("#er-status"); if(s){ s.textContent="● desant…"; s.style.color="#b45309"; setTimeout(function(){ if(s){s.textContent="✓ desat"; s.style.color="#15803d";} },400); }
    }
  }
  function wire(nCols){
    var ce=host.querySelector("#er-cerca");
    if(ce){ ce.addEventListener("input", function(){ q=ce.value; draw(); var el=host.querySelector("#er-cerca"); if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(_){} } }); }
    Array.prototype.forEach.call(host.querySelectorAll("[data-ersug]"), function(it){ it.onclick=function(){ fTercerSel=it.getAttribute("data-ersug"); q=""; draw(); }; });
    var clr=host.querySelector("#er-clearsug"); if(clr) clr.onclick=function(){ fTercerSel=""; q=""; draw(); };
    var os=host.querySelector("#er-ordre"); if(os) os.onchange=function(){ sortBy=os.value; draw(); };
    var od=host.querySelector("#er-ordredir"); if(od) od.onclick=function(){ sortDir=-sortDir; draw(); };
    Array.prototype.forEach.call(host.querySelectorAll("[data-erloc]"), function(cb){ cb.onchange=function(){ loc[cb.getAttribute("data-erloc")]=cb.checked; draw(); }; });
    Array.prototype.forEach.call(host.querySelectorAll("[data-eredit]"), function(cb){ cb.onchange=function(){ edit[cb.getAttribute("data-eredit")]=cb.checked; draw(); }; });
    Array.prototype.forEach.call(host.querySelectorAll("[data-ersort]"), function(th){ th.onclick=function(){ var s=th.getAttribute("data-ersort"); if(sortBy===s) sortDir=-sortDir; else{ sortBy=s; sortDir=1; } draw(); }; });
    host.querySelector("#er-all").onclick=function(){ cfg.dades.forEach(function(r){ sel[r[idf]]=true; }); draw(); };
    host.querySelector("#er-none").onclick=function(){ cfg.dades.forEach(function(r){ sel[r[idf]]=false; }); draw(); };
    Array.prototype.forEach.call(host.querySelectorAll("[data-ersel]"), function(cb){ cb.onchange=function(){ sel[cb.getAttribute("data-ersel")]=cb.checked; draw(); }; });
    var cells=Array.prototype.slice.call(host.querySelectorAll(".er-cell"));
    cells.forEach(function(el,idx){
      if(el.tagName==="SELECT"){
        el.onchange=function(){ if(el.value==="__NOU__"){ var c=cfg.camps.filter(function(x){return x.id===el.getAttribute("data-field");})[0]; var nou=crearCat(c.crearTipus); if(nou){ var rec=cfg.dades.filter(function(r){return String(r[idf])===String(el.getAttribute("data-id"));})[0]; if(rec){ rec[el.getAttribute("data-field")]=nou; cfg.desar(); } } draw(); return; } commit(el); };
      } else { el.addEventListener("blur", function(){ commit(el); }); }
      el.addEventListener("keydown", function(e){
        var target=null;
        if(e.key==="Tab"){ e.preventDefault(); commit(el); target=cells[e.shiftKey?idx-1:idx+1]; }
        else if(e.key==="ArrowDown"){ e.preventDefault(); commit(el); target=cells[idx+nCols]; }
        else if(e.key==="ArrowUp"){ e.preventDefault(); commit(el); target=cells[idx-nCols]; }
        else if(e.key==="Enter"){ e.preventDefault(); commit(el); target=cells[idx+nCols]; }
        else if((e.key==="ArrowRight"||e.key==="ArrowLeft") && (el.tagName==="SELECT" || (el.type!=="date" && el.selectionStart===(e.key==="ArrowRight"?el.value.length:0)))){ e.preventDefault(); commit(el); target=cells[e.key==="ArrowRight"?idx+1:idx-1]; }
        if(target){ target.focus(); if(target.select) try{ target.select(); }catch(_){} }
      });
    });
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   REBUT IMPAGAT (08/09/2026) — el banc torna un rebut, i el recobrament ha de
   tornar a entrar a la tresoreria.
   ---------------------------------------------------------------------------
   Abans hi havia «Registrar devolució», que treballava sobre la FACTURA SENCERA
   i no deixava cap data de cobrament prevista: el recobrament desapareixia de la
   projecció i te n'havies de recordar tu.

   Ara es marca UN VENCIMENT (que pot ser un parcial d'una factura fraccionada) i
   passa això:
     · dues línies REALS a tresoreria amb la data de la devolució: l'import del
       rebut tornat i les despeses que ens carrega el banc;
     · el venciment torna a PENDENT amb una nova data de cobrament prevista
       (conserva el venciment original per als dies d'endarreriment);
     · les despeses que repercutim al client entren com a PREVISIÓ de moviment a
       aquella data. Per això la projecció suma rebut + despeses —el recobrament
       de debò— SENSE tocar l'import ni la base fiscal de la factura, que és un
       invariant que no es toca mai.

   ⚠ Les despeses del banc i les que repercutim al client són camps SEPARATS a
   posta: sovint no coincideixen, i el client pot acabar pagant més o menys. La
   diferència es resol pel flux de cobrament parcial de sempre.

   La factura només passa a «Retornada» si no li queda cap venciment cobrat; si
   és un parcial d'una factura amb altres rebuts ja cobrats, la factura es queda
   com estava i el que canvia és el rebut.
   ═══════════════════════════════════════════════════════════════════════════ */
function _vencEditable(f, i){
  // Retorna l'objecte REAL del venciment dins de state (no la còpia de
  // vencimentsDe), per poder-lo modificar. Si la factura no està fraccionada,
  // treballem sobre la mateixa factura.
  if(f && Array.isArray(f.venciments) && f.venciments.length) return f.venciments[i] || null;
  return null;
}
function _sumaDies(iso, dies){
  var d = new Date((iso||todayISO())+"T00:00:00");
  d.setDate(d.getDate() + dies);
  return d.toISOString().slice(0,10);
}
function modalImpagat(f, idx){
  if(!f) return;

    if(vs.length===1){ idx = 0; }

        '<div id="imp-tria">'+vs.map(function(v,i){
          return '<button type="button" class="btn ghost" data-vi="'+i+'" style="display:block;width:100%;text-align:left;margin-bottom:5px">'+
            '<strong>'+(i+1)+'/'+vs.length+'</strong> · '+fdate(v.data)+' · '+eur(v.import)+
            ' <span class="badge" style="'+(v.estat==="pagat"?"background:#e6f4ea;color:#1a8a5a":"")+'">'+(v.estat==="pagat"?"cobrat":"pendent")+'</span>'+
            (v.impagat?' <span class="badge" style="background:#fdecea;color:#c0392b">ja va tornar</span>':'')+'</button>';
        }).join("")+'</div>'+
        '</div><div class="foot"><button class="btn ghost" data-close>Cancel·lar</button></div>');

        b.onclick=function(){ closeModal(); modalImpagat(f, +b.getAttribute("data-vi")); };
      });
      return;
    }
  }
  var v = vs[idx]; if(!v) return;
  var eraCobrat = (v.estat==="pagat");
  var impRebut = Math.abs(v.import||0);
  var nIntent = ((v.impagat && v.impagat.intents) || 0) + 1;

  openModal('<h3>⊗ Rebut impagat · '+esc(f.num)+'</h3><div class="body">'+
    '<p class="sub" style="margin-top:0">'+esc(f.tercer)+' · venciment '+fdate(v.data)+' · <strong>'+eur(impRebut)+'</strong>'+
      (vs.length>1?' <span class="badge">'+(idx+1)+'/'+vs.length+'</span>':'')+
      (nIntent>1?' <span class="badge" style="background:#fdecea;color:#c0392b">'+nIntent+'a devolució</span>':'')+'</p>'+
    '<div class="grid2">'+
      '<div class="field"><label>Data de la devolució</label><input id="ip-data" type="date" value="'+todayISO()+'"></div>'+
      '<div class="field"><label>Import retornat (€)</label><input id="ip-imp" type="number" step="0.01" value="'+impRebut.toFixed(2)+'"></div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="field"><label>Despeses del banc (€)</label><input id="ip-dbanc" type="number" step="0.01" placeholder="p. ex. 8.50"></div>'+
      '<div class="field"><label>Despeses a repercutir al client (€)</label><input id="ip-drep" type="number" step="0.01" placeholder="normalment les mateixes"></div>'+
    '</div>'+
    '<div class="field"><label>Nova data de cobrament prevista</label><input id="ip-prev" type="date" value="'+_sumaDies(todayISO(),15)+'"></div>'+
    '<div class="field"><label>Nota <span class="sub">(opcional; motiu de la devolució, referència del banc…)</span></label><input id="ip-nota" type="text" placeholder="p. ex. Devolució CaixaBank · sense fons"></div>'+
    '<div class="hint" id="ip-resum"></div>'+
    '</div><div class="foot"><button class="btn ghost" data-close>Cancel·lar</button>'+
    '<button class="btn primary danger" id="ip-ok">Marcar com a impagat</button></div>');

  function _resum(){
    var el=document.getElementById("ip-resum"); if(!el) return;
    var im=parseFloat(val("ip-imp"))||0, db=parseFloat(val("ip-dbanc"))||0, dr=parseFloat(val("ip-drep"))||0;
    var prev=val("ip-prev");
    el.innerHTML =
      'A tresoreria, el <strong>'+fdate(val("ip-data"))+'</strong>: '+
      (eraCobrat? 'devolució <strong>−'+eur(im)+'</strong>' : '<em>cap devolució (el rebut no s\'havia arribat a cobrar)</em>')+
      (db>0? ' i despeses <strong>−'+eur(db)+'</strong>' : '')+'.<br>'+
      'A cobrar el <strong>'+(prev?fdate(prev):'—')+'</strong>, en UNA sola línia: rebut <strong>'+eur(im)+'</strong>'+
      (dr>0? ' + despeses <strong>'+eur(dr)+'</strong> = <strong>'+eur(Math.round((im+dr)*100)/100)+'</strong>' : '')+'.'+
      '<br><span class="sub">L\'import i la base fiscal de la factura no es toquen.</span>';
  }
  ["ip-data","ip-imp","ip-dbanc","ip-drep","ip-prev"].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener("input",_resum);
  });
  // Les despeses a repercutir segueixen les del banc MENTRE no les toquis a mà.
  // (Abans mirava si el camp estava buit, i escrivint «13» copiava només el «1»:
  //  amb la primera tecla ja deixava d'estar buit.)
  var _drepTocat=false;
  var _dr=document.getElementById("ip-drep");
  if(_dr) _dr.addEventListener("input",function(){ _drepTocat=true; });
  var _db=document.getElementById("ip-dbanc");
  if(_db) _db.addEventListener("input",function(){
    var d=document.getElementById("ip-drep");
    if(d && !_drepTocat) d.value=_db.value;
    _resum();
  });
  _resum();

  document.getElementById("ip-ok").onclick=function(){
    var data=val("ip-data"), prev=val("ip-prev"), nota=(val("ip-nota")||"").trim();
    var im=Math.round((parseFloat(val("ip-imp"))||0)*100)/100;
    var db=Math.round((parseFloat(val("ip-dbanc"))||0)*100)/100;
    var dr=Math.round((parseFloat(val("ip-drep"))||0)*100)/100;
    if(!data){ toast("Falta la data de la devolució"); return; }
    if(im<=0){ toast("L'import retornat ha de ser més gran que zero"); return; }
    registraCategoria("Devolucions"); registraCategoria("Comissions");

    // ── 1. Les dues línies reals de tresoreria ──
    if(eraCobrat){
      state.moviments.push({ id:uid(), data:data, concepte:"Devolució rebut "+f.num+(vs.length>1?" ("+(idx+1)+"/"+vs.length+")":""),
        import:-Math.abs(im), tipus:"despesa", categoria:"Devolucions",
        facturaId:f.id, tercerId:f.tercerId||null, tercerNom:null, referencia:f.num||null, conciliat:true });
    }
    if(db>0){
      state.moviments.push({ id:uid(), data:data, concepte:"Despeses devolució "+f.num,
        import:-Math.abs(db), tipus:"despesa", categoria:"Comissions",
        facturaId:f.id, tercerId:f.tercerId||null, tercerNom:null, referencia:f.num||null, conciliat:true });
    }
    // ── 2. Les despeses a repercutir NO generen cap moviment ──
    // Viuen al venciment (v.impagat.despesesRepercutides) i la projecció les suma a
    // la línia del rebut, perquè el banc en farà UN sol apunt. Si es fessin com a
    // moviment de previsió a part, a Tresoreria hi sortirien dues línies i no
    // quadraria amb l'extracte.
    // ── 3. El venciment torna a pendent, amb la nova data prevista ──
    var info={ data:data, importRetornat:im, despesesBanc:db||0, despesesRepercutides:dr||0, intents:nIntent, nota:nota||null };
    var ve=_vencEditable(f, idx);
    if(ve){
      ve.estat="pendent"; ve.movimentId=null; ve.dataCobrament=null;
      ve.dataPrevista=prev||null; ve.impagat=info;
    } else {
      // factura d'un sol venciment: viu als camps de la factura
      f.movimentId=null; f.dataCobrament=null;
      f.dataPrevistaVenc=prev||null; f.impagat=info;
    }
    // ── 4. Estat de la factura: Retornada només si no queda cap rebut cobrat ──
    // ⚠ Compte amb el cercle: si la factura NO està fraccionada, l'estat del seu únic
    // venciment es dedueix de l'estat de la FACTURA (estatTancat), o sigui que
    // preguntar-ho al venciment sempre respondria "cobrat" i la factura es quedaria
    // eternament com a Cobrada — i, pitjor, projeccioVenciments exclou les Cobrades i
    // el recobrament no sortiria enlloc. Amb un sol rebut, si torna, no en queda cap.
    var esUnic = !(f.venciments && f.venciments.length);
    var capCobrat = esUnic ? true : vencimentsDe(f).every(function(x){ return x.estat!=="pagat"; });
    if(capCobrat && f.estat!=="Compensada" && f.estat!=="Reclamada") f.estat="Retornada";

    var txt="Rebut impagat "+fdate(data)+" · "+eur(im)+(db>0?" · despeses banc "+eur(db):"")+
            (dr>0?" · a repercutir "+eur(dr):"")+(prev?" · previst "+fdate(prev):"")+(nota?" · "+nota:"");
    f.notes=(f.notes?f.notes+" | ":"")+txt;
    save(); closeModal(); render(); toast("Rebut marcat com a impagat");
  };
}
// L'antiga «Registrar devolució» passa pel camí nou, perquè no quedin dos
// mecanismes que fan el mateix de manera diferent.
/* Editar un rebut impagat des de la línia de Tresoreria/Previsions: la data
   prevista de cobrament i les despeses que repercutim al client. El total de la
   línia és rebut + despeses, perquè el banc en farà UN sol apunt. */
/* ═══════════════════════════════════════════════════════════════════════════
   DESCOMPTE PER PRONTO PAGO (08/09/2026) — factures de PROVEÏDOR
   ---------------------------------------------------------------------------
   Mateix principi que les despeses d'un rebut impagat, en mirall: una cosa que
   mou la TRESORERIA i que NO toca la factura.

     · A Factures la factura conserva el seu import real i es liquida sencera.
     · A Tresoreria i Previsions el pendent surt per l'import que es pagarà de
       debò: import − descompte.
     · En pagar es fan DUES línies: la de la factura per l'import real (que la
       liquida del tot) i una de «Descompte obtingut» amb facturaId = null.
       L'efecte net al banc és el que realment surt del compte.

   El facturaId = null del descompte és deliberat: si s'enllacés a la factura,
   la factura constaria pagada de més i saltaria com a anomalia a la conciliació.

   ⚠ El descompte NO toca la base imposable ni l'IVA: fiscalment la factura és
   la que és.
   ═══════════════════════════════════════════════════════════════════════════ */
function descompteDe(f, v){
  var d = v ? v.descompte : (f?f.descompte:null);
  var x = d ? Math.abs(parseFloat(d.import)||0) : 0;
  return isNaN(x)?0:Math.round(x*100)/100;
}
function _vencDte(f, idx){
  return (f && f.venciments && f.venciments.length) ? (f.venciments[idx]||null) : null;
}
function modalDescompte(f, idx){
  if(!f || f.tipus!=="proveidor") return;
  var vs=vencimentsDe(f);
  if(idx==null){
    if(vs.length===1){ idx=0; }
    else {
      openModal('<h3>A quin venciment s\'aplica el descompte?</h3><div class="body">'+
        '<p class="sub" style="margin-top:0">'+esc(f.num)+' · '+esc(f.tercer)+' · <strong>'+eur(f.import)+'</strong> en '+vs.length+' venciments</p>'+
        '<div id="dt-tria">'+vs.map(function(v,i){
          return '<button type="button" class="btn ghost" data-vi="'+i+'" style="display:block;width:100%;text-align:left;margin-bottom:5px">'+
            '<strong>'+(i+1)+'/'+vs.length+'</strong> · '+fdate(v.data)+' · '+eur(v.import)+
            ' <span class="badge" style="'+(v.estat==="pagat"?"background:#e6f4ea;color:#1a8a5a":"")+'">'+(v.estat==="pagat"?"pagat":"pendent")+'</span>'+
            (v.descompte?' <span class="pill">ja té descompte</span>':'')+'</button>';
        }).join("")+'</div>'+
        '</div><div class="foot"><button class="btn ghost" data-close>Cancel·lar</button></div>');
      Array.prototype.forEach.call(document.querySelectorAll('#dt-tria [data-vi]'), function(b){
        b.onclick=function(){ closeModal(); modalDescompte(f, +b.getAttribute("data-vi")); };
      });
      return;
    }
  }
  var v=vs[idx]; if(!v) return;
  var brut = netVenciment(f, v.import);
  var ve   = _vencDte(f, idx);
  var actD = ve ? (ve.descompte||null) : (f.descompte||null);
  var act  = actD ? Math.abs(parseFloat(actD.import)||0) : 0;
  openModal('<h3>% Descompte per pronto pago · '+esc(f.num)+'</h3><div class="body">'+
    '<p class="sub" style="margin-top:0">'+esc(f.tercer)+' · venciment '+fdate(v.data)+' · a pagar <strong>'+eur(brut)+'</strong>'+
      (vs.length>1?' <span class="badge">'+(idx+1)+'/'+vs.length+'</span>':'')+'</p>'+
    '<div class="grid2">'+
      '<div class="field"><label>Descompte (%)</label><input id="dt-pct" type="number" step="0.01" placeholder="p. ex. 3" value="'+(actD&&actD.pct?actD.pct:'')+'"></div>'+
      '<div class="field"><label>Descompte (€)</label><input id="dt-imp" type="number" step="0.01" value="'+(act||'')+'"></div>'+
    '</div>'+
    '<div class="field"><label>Nota <span class="sub">(opcional)</span></label><input id="dt-nota" type="text" placeholder="p. ex. 3% pronto pago a 10 dies" value="'+esc(actD&&actD.nota?actD.nota:'')+'"></div>'+
    '<div class="hint" id="dt-resum"></div>'+
    '</div><div class="foot">'+
      (act>0?'<button class="btn ghost danger" id="dt-treu" style="margin-right:auto">Treure el descompte</button>':'')+
      '<button class="btn ghost" data-close>Cancel·lar</button>'+
      '<button class="btn primary" id="dt-ok">Aplicar descompte</button></div>');
  function _r(){
    var el=document.getElementById("dt-resum"); if(!el) return;
    var x=Math.round((parseFloat(val("dt-imp"))||0)*100)/100;
    el.innerHTML='A Tresoreria i Previsions hi constarà <strong>'+eur(Math.round((brut-x)*100)/100)+'</strong> '+
      '(factura '+eur(brut)+(x>0?' − descompte '+eur(x):'')+').<br>'+
      '<span class="sub">A Factures la factura es queda amb el seu import real i es liquidarà sencera; el descompte es registrarà com a «Descompte obtingut».</span>';
  }
  var _pct=document.getElementById("dt-pct"), _imp=document.getElementById("dt-imp");
  if(_pct) _pct.addEventListener("input",function(){
    var p=parseFloat(_pct.value); if(!isNaN(p)&&p>0){ _imp.value=(Math.round(brut*p)/100).toFixed(2); } _r();
  });
  if(_imp) _imp.addEventListener("input",function(){ if(_pct) _pct.value=""; _r(); });
  _r();
  var _tr=document.getElementById("dt-treu");
  if(_tr) _tr.onclick=function(){
    if(ve) delete ve.descompte; else delete f.descompte;
    save(); closeModal(); render(); toast("Descompte tret");
  };
  document.getElementById("dt-ok").onclick=function(){
    var x=Math.round((parseFloat(val("dt-imp"))||0)*100)/100;
    var p=parseFloat(val("dt-pct")); var nota=(val("dt-nota")||"").trim();
    if(x<=0){ toast("Posa un import de descompte"); return; }
    if(x>=brut){ toast("El descompte no pot ser igual o més gran que l'import a pagar"); return; }
    var info={ import:x, pct:(isNaN(p)||p<=0)?null:p, nota:nota||null, data:todayISO() };
    if(ve) ve.descompte=info; else f.descompte=info;
    save(); closeModal(); render(); toast("Descompte aplicat");
  };
}
function modalImpagatEdit(fid, vidx){

function parseDiesMes(s){ if(!s) return []; return String(s).split(/[,;\s]+/).map(function(x){return parseInt(x,10);}).filter(function(n){return n>=1&&n<=31;}); }
function ymdLocal(dt){ var y=dt.getFullYear(), m=("0"+(dt.getMonth()+1)).slice(-2), d=("0"+dt.getDate()).slice(-2); return y+"-"+m+"-"+d; }
function calcVenciment(dataEmissio, termini, diesMesArr){
  if(!dataEmissio) return "";
  var p=dataEmissio.split("-"); var base=new Date(+p[0], +p[1]-1, +p[2]);
  var t=parseInt(termini,10); if(!isNaN(t)&&t>0) base.setDate(base.getDate()+t);
  if(!diesMesArr||!diesMesArr.length) return ymdLocal(base);
  var cands=[];
  for(var add=0; add<4; add++){
    var yy=base.getFullYear(), mm=base.getMonth()+add;
    while(mm>11){ mm-=12; yy++; }
    var last=new Date(yy, mm+1, 0).getDate();
    diesMesArr.forEach(function(day){ var dd=Math.min(day,last); cands.push(new Date(yy,mm,dd)); });
  }
  cands=cands.filter(function(c){ return c>=base; }).sort(function(a,b){ return a-b; });
  return ymdLocal(cands.length?cands[0]:base);
}

    if(efectiu){ f.formaPagament="Efectiu"; }
    if(_potDte && _dt>0 && c && c.indexOf("dte.")<0) c=c+" · dte. pronto pago "+eur(_dt);
    if(multi) saldaVenciment(f, vencIdx, d, c, efectiu, (_potDte?_dt:0)); else if(pagar) pagarFactura(f,d,c,efectiu,(_potDte?_dt:0)); else cobrarFactura(f,d,c,efectiu);
    // ── Descompte pronto pago: NO és un pagament de la factura ──
    // La factura s'ha liquidat amb el seu import real (a dalt); aquí registrem la
    // diferència que NO surt del banc. facturaId=null perquè la factura no consti
    // pagada de més.
    if(_potDte && _dt>0){
      // v1.19 · es desa a la factura/venciment (com el botó «% Descompte pronto pago») i es registra la diferència
      var _pctD=parseFloat(val("c-dtepct")); _pctD=(isNaN(_pctD)||_pctD<=0)?null:_pctD;
      var _veD=_vencDte(f, multi?vencIdx:0), _infoD={ import:_dt, pct:_pctD, nota:null, data:d };
      if(_veD) _veD.descompte=_infoD; else f.descompte=_infoD;
      save();
    } else if(_potDte && _dteCob && _dt===0){
      var _veD0=_vencDte(f, multi?vencIdx:0); if(_veD0) delete _veD0.descompte; else delete f.descompte; save();
    }
    // ── Despeses repercutides al client: ingrés PROPI, no cobrament de la factura ──
    var _dr=_impCob?parseFloat(val("c-drep")):NaN;
    if(!efectiu && _impCob && !isNaN(_dr) && _dr>0){
      registraCategoria("Despeses repercutides");
      state.moviments.push({ id:uid(), data:d, concepte:"Despeses impagat "+f.num+" repercutides",
        import:Math.abs(_dr), tipus:"cobrament", categoria:null,
        facturaId:null, tercerId:f.tercerId||null, tercerNom:f.tercer||null,
        referencia:f.num||null, conciliat:true });
      save();
    }
    var desp=parseFloat(val("c-desp"));
    if(!efectiu && !isNaN(desp) && desp>0){
      var _banc=bancTercer(val("c-banc"));
      registraCategoria("Bancs i comissions");
      state.moviments.push({ id:uid(), data:d, concepte:"Despeses "+(pagar?"pagament ":"cobrament ")+f.num, import:-Math.abs(desp), tipus:"despesa", categoria:"Bancs i comissions", facturaId:null, tercerId:_banc.id, tercerNom:null, referencia:f.num||null, conciliat:true });
      save();
    }
    closeModal(); render(); toast(efectiu ? (pagar?"Pagament en efectiu (sense moviment al banc)":"Cobrament en efectiu (sense moviment al banc)") : (pagar?"Pagament registrat":"Cobrament registrat"));
  };
}

function trimestreKey(f){ var d=(f&&(f.dataEmissio||f.venciment||f.dataCobrament))||""; if(d.length<7) return {k:"0000-0",lab:"Sense data"}; var y=d.slice(0,4), m=parseInt(d.slice(5,7),10)||1, t=Math.floor((m-1)/3)+1; return {k:y+"-"+t, lab:"Trimestre "+t+" · "+y}; }

  openModal('<h3>🏦 Ingrés d\'efectiu al banc</h3><div class="body">'+
    '<p class="sub" style="margin-top:0">Passa diners de la <strong>Caixa</strong> al <strong>banc</strong>: es crea una sortida de caixa i una entrada al banc per la mateixa quantitat. Caixa ara: <strong>'+eur(scx)+'</strong>.</p>'+
    '<div class="grid2"><div class="field"><label>Import a ingressar (€)</label><input id="ic-import" type="number" step="0.01" placeholder="0.00" autocomplete="off"></div>'+
    '<div class="field"><label>Data</label><input id="ic-data" type="date" value="'+todayISO()+'"></div></div>'+
    '<div class="field"><label>Concepte</label><input id="ic-conc" value="Ingrés d\'efectiu al banc" autocomplete="off"></div>'+
    '<div class="hint" id="ic-info"></div>'+
    '</div><div class="foot"><button class="btn ghost" data-close>Cancel·lar</button><button class="btn primary" id="ic-ok">Fer l\'ingrés</button></div>');
  var inp=document.getElementById("ic-import"), info=document.getElementById("ic-info");
  function refresh(){ var x=parseFloat(inp.value); if(isNaN(x)||x<=0){ info.textContent=""; return; } info.innerHTML='Caixa passarà de <strong>'+eur(scx)+'</strong> a <strong>'+eur(Math.round((scx-x)*100)/100)+'</strong>; el banc pujarà <strong>'+eur(x)+'</strong>.'; }
  inp.addEventListener("input",refresh);
  document.getElementById("ic-ok").onclick=function(){
    var x=parseFloat(inp.value); if(isNaN(x)||x<=0){ toast("Import no vàlid"); return; }
    x=Math.round(x*100)/100; var d=val("ic-data"), c=(val("ic-conc")||"").trim()||"Ingrés d'efectiu al banc";
    var tid=uid();
    // Sortida de la caixa (−) i entrada al banc (+). tipus "traspas" per no comptar-ho com a ingrés/despesa a l'anàlisi.
    state.moviments.push({ id:uid(), data:d, concepte:c, import:-x, tipus:"traspas", categoria:null, compte:"caixa", conciliat:true, transferId:tid });
    state.moviments.push({ id:uid(), data:d, concepte:c, import:+x, tipus:"traspas", categoria:null, conciliat:true, transferId:tid });
    save(); closeModal(); render(); toast("Ingrés al banc fet: "+eur(x));
  };
}

// Treu l'enllaç d'un moviment amb la seva factura: la factura torna a pendent (si aquest moviment
// n'era el pagament) i el moviment es queda al banc com a moviment solt, editable lliurement.
function desenllacarMov(m){
  var fids=factsDeMoviment(m);
  // 17/09/2026 · v1.8 · Si el moviment és un TRAM de la factura (entrega a compte o venciment
  // fraccionat), abans no es desfeia res: la condició de sota només mira f.movimentId.
  fids.forEach(function(fid){ var f=findFactura(fid); if(f && Array.isArray(f.venciments) && f.venciments.some(function(v){return v.movimentId===m.id;})) _desenllacaTram(f, m.id); });
  if(m.aCompte && m.aCompteOrig){ m.tipus=m.aCompteOrig.tipus||m.tipus; m.categoria=m.aCompteOrig.categoria||null; delete m.aCompteOrig; }
  fids.forEach(function(fid){ var f=findFactura(fid); if(f && f.movimentId===m.id){
    f.movimentId=null; f.dataCobrament=null;
    f.estat = f.tipus==="client" ? (f.remesaId?"Remesada":"Emesa") : "Rebuda";
    if(Array.isArray(f.venciments)) f.venciments.forEach(function(v){ if(v.movimentId===m.id){ v.movimentId=null; v.estat="pendent"; v.dataCobrament=null; } });
  } });
  m.facturaId=null; m.facturaIds=null; m.conciliat=false;
}
function modalMovimentEdit(id){

  var fUnica = fids.length===1 ? findFactura(fids[0]) : null;
  var impFactMov = fUnica ? importVencimentDe(fUnica, m.id) : null;   // import que hauria de tenir segons la factura/venciment
  var desajustat = impFactMov!=null && Math.abs(Math.abs(m.import)-impFactMov)>0.005;
  var avisLligat = linked ? '<div class="avis-liq">🔗 Aquest moviment és el '+((m.import<0)?"pagament":"cobrament")+' de '+(fids.length>1?('<strong>'+fids.length+' factures</strong>'):('la factura <strong>'+esc(String((fUnica||{}).num||fids[0]))+'</strong>'))+'. Pots corregir <strong>data, concepte, tercer i referència</strong>. Per canviar l\'<strong>import</strong> o el <strong>tipus</strong>, fes-ho des de la factura o prem <strong>«Treure enllaç»</strong> per deixar-lo com a moviment solt.'+(desajustat?'<br><strong style="color:#b45309">⚠ L\'import ('+eur(Math.abs(m.import))+') no coincideix amb la factura ('+eur(impFactMov)+').</strong> Prem <strong>«↻ Igualar a la factura»</strong> per quadrar-lo.':'')+'</div>' : '';
  var esDesp=(m.tipus==="despesa")||(m.import<0 && m.tipus!=="ingres");
  var tnom=m.tercerNom||((m.tercerId&&findTercer(m.tercerId))?findTercer(m.tercerId).nom:"");
  openModal('<h3>Editar moviment'+(linked?' · lligat a factura':'')+'</h3><div class="body">'+ avisLligat +
    '<div class="grid2"><div class="field"><label>Tipus</label><select id="v-tipus"'+(linked?' disabled':'')+'><option value="despesa" '+(esDesp?"selected":"")+'>Despesa (sortida)</option><option value="ingres" '+(!esDesp?"selected":"")+'>Ingrés (entrada)</option></select></div>'+
    '<div class="field"><label>Data</label><input id="v-data" type="date" value="'+esc(m.data)+'"></div></div>'+
    '<div class="field"><label>Concepte</label><input id="v-conc" value="'+esc(m.concepte||"")+'"></div>'+
    '<div class="grid2"><div class="field"><label>Tercer / emissor</label><input id="v-tercer" list="dl-mov-tercers" value="'+esc(tnom)+'" autocomplete="off"><datalist id="dl-mov-tercers">'+emissorsList().map(function(n){return '<option value="'+esc(n)+'">';}).join('')+'</datalist></div>'+
    '<div class="field"><label>Referència / document</label><input id="v-ref" value="'+esc(m.referencia||"")+'"></div></div>'+
    '<div class="grid2"><div class="field"><label>Import (€)'+(linked?' <span class="sub">(des de la factura)</span>':'')+'</label><input id="v-import" type="number" step="0.01" value="'+esc(Math.abs(m.import))+'"'+(linked?' disabled':'')+'></div>'+
    '<div class="field" id="v-catwrap"><label>Categoria</label><div class="combo"><input id="v-cat" autocomplete="off" value="'+esc(m.categoria||"")+'"><button type="button" class="combo-arrow" data-comboarrow="cl-cat">▼</button><div class="combo-list" id="cl-cat" style="display:none"><div class="suggest-item er-nou" data-combonou="categoria" data-combotarget="v-cat">➕ Generar nova categoria</div>'+comboItemsHTML("v-cat", categoriesList())+'</div></div></div></div>'+
    ((linked||esCaixa(m))?'':'<label style="display:flex;gap:8px;align-items:center;margin:6px 0 2px"><input type="checkbox" id="v-previst" style="width:auto"'+(esPrevisio(m)?' checked':'')+'> 🕓 És una <strong>previsió</strong> (no compta al saldo real fins que la confirmis)</label>')+
    (linked ? (m.aCompte?'<div class="hint" style="margin:6px 0 2px">⏳✓ <strong>Entrega a compte</strong> inclosa a la factura. Si treus l\'enllaç, l\'import torna a la resta pendent de la factura i l\'entrega torna a quedar pendent de factura.</div>':'') : '<label style="display:flex;gap:8px;align-items:center;margin:6px 0 2px"><input type="checkbox" id="v-acompte" style="width:auto"'+(m.aCompte?' checked':'')+'> ⏳ <strong>Entrega a compte</strong> · pendent de factura <span class="sub">(pagament avançat a un proveïdor o cobrament avançat d\'un client; es lliga a la factura quan arribi)</span></label>')+
    '<label style="display:flex;gap:8px;align-items:center;margin:6px 0 2px"><input type="checkbox" id="v-revisar" style="width:auto"'+(m.revisar?' checked':'')+'> 📝 Falta actualitzar la informació d\'aquest moviment</label>'+
    '<div class="field"><label>Motiu / què falta (opcional)</label><input id="v-revnota" value="'+esc(m.revisarNota||"")+'" placeholder="p. ex. pendent que arribi la factura de Vueling"></div>'+

      (linked
        ? '<button class="btn ghost danger" id="v-unlink" style="margin-right:auto" title="La factura torna a pendent i el moviment es queda al banc">🔗✕ Treure enllaç</button>'+(impFactMov!=null?'<button class="btn '+(desajustat?'primary':'ghost')+'" id="v-sync" title="Posar l\'import del moviment igual al de la factura/venciment">↻ Igualar a la factura ('+eur(impFactMov)+')</button>':'')+(fUnica?'<button class="btn ghost" id="v-openf">Obrir factura</button>':'')
        : '<button class="btn ghost danger" id="v-del" style="margin-right:auto">🗑 Esborrar</button><button class="btn ghost" id="v-dup">⧉ Duplicar</button><button class="btn ghost" id="v-conv">🧾 Convertir en factura</button>')+
      '<button class="btn ghost" data-close>Cancel·lar</button><button class="btn primary" id="v-ok">Desar</button></div>');

    document.getElementById("v-unlink").onclick=function(){ if(!confirm("Treure l'enllaç amb la factura?\n\nEl moviment ES QUEDA al banc (no s'esborra) i la factura torna a pendent. Després podràs editar-lo del tot.")) return; desenllacarMov(m); save(); closeModal(); modalMovimentEdit(m.id); toast("Enllaç tret"); };
  } else {
    document.getElementById("v-conv").onclick=function(){ modalConvertirFactura(m.id); };
    document.getElementById("v-dup").onclick=function(){ modalDuplicarMoviment(m.id); };
    document.getElementById("v-del").onclick=function(){ if(!confirm("Esborrar aquest moviment de tresoreria? Aquesta acció no es pot desfer.")) return; state.moviments=state.moviments.filter(function(x){return x.id!==m.id;}); save(); closeModal(); render(); toast("Moviment esborrat"); };
    document.getElementById("v-tipus").onchange=function(){ document.getElementById("v-catwrap").style.display = this.value==="despesa"?"":"none"; };
  }
  document.getElementById("v-ok").onclick=function(){
    var conc=val("v-conc").trim();
    if(!conc){ toast("Falta el concepte"); return; }
    var tercerNom=val("v-tercer").trim(); var _tr=assegTercerMoviment(tercerNom, val("v-tipus")==="despesa"?-1:1); var tt=_tr?_tr.t:null;

      // Moviment lligat: no toquem import ni tipus; sí la categoria (si és despesa) i sincronitzem la data.

      if(fUnica && fUnica.movimentId===m.id){ fUnica.dataCobrament=m.data; }

      var tipus=val("v-tipus"), imp=parseFloat(val("v-import"));
      if(isNaN(imp)||imp<=0){ toast("Import no vàlid"); return; }
      m.import=tipus==="despesa"?-imp:imp; m.tipus=tipus; m.categoria=tipus==="despesa"?val("v-cat").trim():null;
      var _pv=document.getElementById("v-previst");
      if(_pv){ if(_pv.checked){ m.previst=true; } else { delete m.previst; } }
      var _ac=document.getElementById("v-acompte"); if(_ac){ if(_ac.checked){ m.aCompte=true; } else { delete m.aCompte; } }
    }
    save(); closeModal(); render(); toast("Moviment actualitzat"); _fitxaTercerNou(_tr);
  };
  wireCombos();
}

function _netNum(x){ return (""+x).replace(/[\s.,;:_\-]+$/,"").trim(); }
function deduirNumFactura(concepte){
  if(!concepte) return "";
  var c=(""+concepte).trim();
  c=c.replace(/^\s*\d{1,3}\/\d{1,3}\s+/,"");          // treu fracció inicial 1/3, 13/60…
  var m;
  m=c.match(/\b(?:FRA|FRE|FACTURA|FACT)\b\.?\s*[:\-]?\s*([A-Z]{0,3}[-.\/]?\d[\dA-Z.\-\/]*)/i); if(m) return _netNum(m[1]);
  m=c.match(/\b([A-Z]{1,3}\/\d[\d.\-\/]*)\b/);         if(m) return _netNum(m[1]);   // A/5910
  m=c.match(/\b(F[EM]\d[0-9A-Z]*)\b/i);                if(m) return _netNum(m[1]);   // FE2600…, FM4V…
  m=c.match(/\b(F[-\s]?\d{3,}[\d.\-\/]*)\b/i);         if(m) return _netNum(m[1]);   // F-194622
  return "";
}
/* ═══ 17/09/2026 · v1.8 · ENTREGUES A COMPTE (pagaments/cobraments avançats abans de la factura) ═══
   1) A Tresoreria el moviment es marca aCompte:true («⏳ a compte · pendent de factura»).
   2) Quan arriba la factura, s'hi lliguen: cada entrega esdevé un TRAM PAGAT de f.venciments

   3) El moviment conserva aCompte:true (història) i passa a «✓ a compte · fra. NUM».
   Val per a proveïdors (pagaments, import < 0) i clients (cobraments, import > 0).
   Límits: no per a abonaments, factures amb retenció d'IRPF, remesades, o amb descompte/impagat

function aplicaEntreguesACompte(f, movs, dataResta){
  var motiu=_motiuNoACompte(f); if(motiu) return motiu;
  if(!movs || !movs.length) return "Cap entrega seleccionada";
  var pagar = f.tipus==="proveidor";
  var pend = importPendent(f);
  var E = Math.round(movs.reduce(function(a,m){ return a+Math.abs(m.import||0); },0)*100)/100;
  if(E > pend+0.005) return "Les entregues ("+eur(E)+") superen el que queda pendent de la factura ("+eur(pend)+")";
  var r = function(x){ return Math.round(x*100)/100; };
  var pagatsAbans = (Array.isArray(f.venciments) && f.venciments.length) ? f.venciments.filter(function(v){ return v.estat==="pagat"; }) : [];
  var nous = movs.map(function(m){ return { data:m.data, import:r(Math.abs(m.import||0)), estat:"pagat", movimentId:m.id, dataCobrament:m.data, dataPrevista:null, impagat:null, descompte:null, aCompte:true }; });

  var R = r(pend-E);

    var vp=vencimentsDe(f).filter(function(v){ return v.estat!=="pagat"; });
    arr.push({ data: dataResta || (vp[0]&&vp[0].data) || f.venciment || todayISO(), import:R, estat:"pendent", movimentId:null, dataCobrament:null, dataPrevista:null, impagat:null, descompte:null });
  }
  var tt = tercerPerNom(f.tercer);
  movs.forEach(function(m){
    if(!m.aCompteOrig) m.aCompteOrig = { tipus:m.tipus||null, categoria:m.categoria||null };
    m.aCompte=true; m.facturaId=f.id; m.facturaIds=null;

    if(tt){ m.tercerId=tt.id; m.tercerNom=null; }
  });
  if(arr.length===1){
    f.venciments=null; f.movimentId=arr[0].movimentId; f.dataCobrament=arr[0].dataCobrament;
    f.estat = pagar ? "Pagada" : "Cobrada";
  } else {
    f.venciments=arr; f.movimentId=null; f.venciment=arr[0].data;
    if(arr.every(function(v){ return v.estat==="pagat"; })){
      f.estat = pagar ? "Pagada" : "Cobrada"; f.dataCobrament = arr[arr.length-1].dataCobrament;
    } else {
      f.estat = pagar ? "Rebuda" : "Emesa"; f.dataCobrament=null;
    }
  }
  save();
  return "";
}
/* Treure un tram lligat a un moviment. Entrega a compte → el tram desapareix i el seu import torna
   a la resta pendent. Venciment fraccionat normal → torna a pendent. */
function _desenllacaTram(f, mid){
  var r = function(x){ return Math.round(x*100)/100; };
  var idx=-1; f.venciments.forEach(function(v,i){ if(v.movimentId===mid) idx=i; }); if(idx<0) return;
  var v=f.venciments[idx];
  if(v.aCompte){
    f.venciments.splice(idx,1);
    var j=-1; f.venciments.forEach(function(x,i){ if(x.estat!=="pagat") j=i; });
    if(j>=0) f.venciments[j].import = r((f.venciments[j].import||0) + (v.import||0));
    else f.venciments.push({ data:f.venciment||v.data, import:r(v.import||0), estat:"pendent", movimentId:null, dataCobrament:null, dataPrevista:null, impagat:null, descompte:null });
  } else {
    v.movimentId=null; v.estat="pendent"; v.dataCobrament=null;
  }
  if(f.venciments.length===1){
    var u=f.venciments[0];
    if(u.estat==="pagat"){ f.movimentId=u.movimentId; f.dataCobrament=u.dataCobrament; }
    else { f.venciment=u.data||f.venciment; f.movimentId=null; }
    f.venciments=null;
  }
  if(!vencimentsDe(f).every(function(x){ return x.estat==="pagat"; })){
    f.dataCobrament=null;
    f.estat = f.tipus==="client" ? (f.remesaId?"Remesada":"Emesa") : "Rebuda";
  }

function normNomImport(s){
  if(!s) return '';
  s=String(s).toUpperCase().trim();
  s=s.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  s=s.replace(/[.,;]/g,' ');
  s=s.replace(/\b(S\s*L\s*U|S\s*L\s*P|S\s*L|S\s*A|S\s*C\s*P|S\s*C|SLNE|C\s*B|SCCL)\b/g,' ');
  s=s.replace(/[^A-Z0-9 ]/g,' ');
  s=s.replace(/\s+/g,' ').trim();
  return s;
}

  if((tercer.regimIva==null||tercer.regimIva===""||tercer.regimIva==="general") && rec.regimIva && rec.regimIva!=="general") fills.regimIva=rec.regimIva;

function processImportTercers(arr){

    if(t){ enriquir.push({rec:rec, tercer:t, fills:calcFills(t,rec), done:false}); return; }
    var cand=null;
    for(var i=0;i<liveKeys.length;i++){ var lk=liveKeys[i]; if(k1 && lk.length>=5 && k1.length>=5 && (lk.indexOf(k1)>=0||k1.indexOf(lk)>=0)){ cand=liveByNorm[lk]; break; } }
    if(cand){ conflictes.push({rec:rec, cand:cand, done:false}); return; }

// ===== Conciliació de duplicats a Tercers (v2) =====
// Enllaça moviments de banc importats (sense facturaId) que són el COBRAMENT d'una
// factura del seu tercer (citen el seu número al concepte), perquè la fitxa del tercer
// no els compti dues vegades. NO canvia estats de factura ni el saldo del banc.
// Regla afinada: exclou moviments que NO semblen cobrament (abonaments, devolucions,
// despeses, comissions...) i les factures on els cobraments citats sumen MÉS del total;
// aquests van a un grup "A revisar" (desmarcat) perquè ho decideixis tu.
function _numsConcepte(s){ return String(s||"").match(/\d{1,6}/g) || []; }
var _KW_NOCOBR=/(DEVOLU|DESPES|COMISS|REGULARITZ|RETORN|ABON|IMPAG|GASTO)/i;
function detectarConciliables(){
  var facByTer={};
  (state.factures||[]).forEach(function(f){ if(!f.tercerId) return; (facByTer[f.tercerId]=facByTer[f.tercerId]||[]).push(f); });
  var cand=[], revisar=[];
  (state.moviments||[]).forEach(function(m){
    if(m.facturaId || (m.facturaIds&&m.facturaIds.length)) return;
    if(!m.tercerId) return;
    var cands=facByTer[m.tercerId]; if(!cands) return;
    var toks=_numsConcepte(m.concepte); if(!toks.length) return;
    var hits=cands.filter(function(f){ return toks.indexOf(String(f.num))>=0; });
    if(!hits.length) return;
    var imp=Math.round(Math.abs(m.import||0)*100)/100;
    var ex=hits.filter(function(f){ return Math.round(Math.abs(f.import||0)*100)/100===imp; });
    var nums={}; hits.forEach(function(f){ nums[String(f.num)]=1; });
    if(_KW_NOCOBR.test(m.concepte||"")){ revisar.push({mov:m, fact:hits[0], motiu:"no sembla cobrament"}); return; }
    if(ex.length===1){ cand.push({mov:m, fact:ex[0], tipus:"exacte"}); }
    else if(Object.keys(nums).length===1){ cand.push({mov:m, fact:hits[0], tipus:"parcial"}); }
    else { revisar.push({mov:m, fact:hits[0], motiu:"cita mes d'una factura"}); }
  });
  var byF={};
  cand.forEach(function(c){ (byF[c.fact.id]=byF[c.fact.id]||{fact:c.fact,items:[]}).items.push(c); });
  var segurs=[];
  Object.keys(byF).forEach(function(k){
    var g=byF[k];
    var inv=Math.round(Math.abs(g.fact.import||0)*100)/100;
    var sum=Math.round(g.items.reduce(function(a,c){return a+Math.abs(c.mov.import||0);},0)*100)/100;
    if(sum<=inv+0.02){ g.items.forEach(function(c){ segurs.push(c); }); }
    else { g.items.forEach(function(c){ revisar.push({mov:c.mov, fact:c.fact, motiu:"cobraments > total factura"}); }); }
  });
  return {segurs:segurs, revisar:revisar};
}

function empresaNomDefecte(){
  var m={roures:"ROURES INTERIORISME SL", crisanglass:"CRISANGLASS"};
  return m[PANELL_DB_EMPRESA] || (PANELL_DB_EMPRESA||"Empresa").toUpperCase();
}
function empresaNomExtracte(){ return (state.config.empresaNom||"").trim() || empresaNomDefecte(); }
// Referència d'un moviment per a l'extracte: referència pròpia, o número/tercer de la factura lligada.
// Referència / document del moviment (ja no hi posem el tercer: té columna pròpia).
function refMoviment(m){
  if(m.referencia) return m.referencia;
  var fids=factsDeMoviment(m);
  if(fids.length===1){ var f=findFactura(fids[0]); if(f) return f.num||""; }
  if(fids.length>1) return fids.length+" factures";
  return "";
}
// Tercer del moviment: el propi, o el de la factura lligada.
function tercerDeMoviment(m){
  if(m.tercerNom) return m.tercerNom;
  if(m.tercerId){ var t=findTercer(m.tercerId); if(t) return t.nom; }
  var fids=factsDeMoviment(m);
  if(fids.length===1){ var f=findFactura(fids[0]); if(f) return f.tercer||""; }
  return "";
}
// Forma de pagament del moviment: de la factura lligada, o del tercer.
function formaPagamentDeMoviment(m){
  var fids=factsDeMoviment(m);
  if(fids.length===1){ var f=findFactura(fids[0]); if(f && f.formaPagament) return f.formaPagament; }
  if(m.tercerId){ var t=findTercer(m.tercerId); if(t && t.formaPagament) return t.formaPagament; }
  return "";
}
function extracteEntreDates(dIni, dFi){
  var reals=movsBancReals(), saldoIni=state.config.saldoInicial||0;   // exclou previsions (no són al banc)
  reals.forEach(function(m){ if((m.data||"")<dIni) saldoIni+=(m.import||0); });
  saldoIni=Math.round(saldoIni*100)/100;
  var run=saldoIni, rows=[], carrecs=0, abonaments=0;
  reals.forEach(function(m){
    var d=m.data||""; if(d<dIni || d>dFi) return;
    var imp=Math.round((m.import||0)*100)/100;
    run=Math.round((run+imp)*100)/100;
    if(imp<0) carrecs+=imp; else abonaments+=imp;
    rows.push({ data:d, concepte:m.concepte||"", tercer:tercerDeMoviment(m), forma:formaCurta(formaPagamentDeMoviment(m)), ref:refMoviment(m), import:imp, saldo:run });
  });
  return { dIni:dIni, dFi:dFi, saldoIni:saldoIni, saldoFi:run,
           carrecs:Math.round(carrecs*100)/100, abonaments:Math.round(abonaments*100)/100, n:rows.length, rows:rows };
}

function _crc32(buf){
  var table=_crc32.t;
  if(!table){ table=_crc32.t=[]; for(var n=0;n<256;n++){ var c=n; for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); table[n]=c>>>0; } }

  for(var i=0;i<buf.length;i++) crc=(crc>>>8)^table[(crc^buf[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function _zip(files){

  function u32(n){ return [n&0xFF,(n>>>8)&0xFF,(n>>>16)&0xFF,(n>>>24)&0xFF]; }
  files.forEach(function(f){
    var nameB=enc.encode(f.name), data=f.data, crc=_crc32(data);
    var local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    chunks.push(new Uint8Array(local),nameB,data);
    var cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cen),nameB);
    offset+=local.length+nameB.length+data.length;
  });
  var centralSize=0; central.forEach(function(c){ centralSize+=c.length; });
  var end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralSize),u32(offset),u16(0));
  var all=chunks.concat(central); all.push(new Uint8Array(end));
  var total=0; all.forEach(function(a){ total+=a.length; });
  var out=new Uint8Array(total), p=0; all.forEach(function(a){ out.set(a,p); p+=a.length; });
  return out;
}
function _xmlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function _colL(i){ var s=""; i++; while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function _cellXml(col,row,cell){

/* ============ v1.17 · LLISTAT DE FACTURES (pestanya Factures → «📋 Llistat») ============
   1) Un diàleg per triar els CRITERIS: clients / proveïdors / tots, un tercer o tots, quina data mana
      (emissió, venciment o cobrament/pagament), PERÍODE (any, trimestre, mes o dates a mà) + any, estat
      (totes / pendents / saldades / vençudes), proformes sí/no i agrupar per tercer amb subtotals.
   2) El LLISTAT a pantalla completa (view "llistat"), amb la màxima informació: totes les columnes que
      tinguin alguna dada, totals a dalt i a baix, ordenació clicant la capçalera, clic a la fila = obre
      la factura. Des d'allà: 🖨️ Imprimir / PDF (horitzontal) o ⬇️ Excel (.xlsx).
   Tota la selecció passa per llistatFiltra(c) i les columnes per LL_COLS: és on s'afegiran cerques i
   columnes noves. */
var LL = null;
var _LL_MESOS=["Gener","Febrer","Març","Abril","Maig","Juny","Juliol","Agost","Setembre","Octubre","Novembre","Desembre"];
function llistatDefecte(){
  var y=+todayISO().slice(0,4);
  var c={ tipus:"client", tercer:"", camp:"emissio", estat:"totes", proformes:false, agrupar:false, periode:"any", any:y, ordre:null };
  var p=_llPeriode(c.periode, c.any); c.ini=p.ini; c.fi=p.fi; return c;
}
/* Període → dates. periode: "any", "T1".."T4", "M01".."M12" o "manual" (dates escrites a mà) */
function _llPeriode(periode, any){
  var y=+any, dm=function(m){ return new Date(y, m, 0).getDate(); }, p2=function(n){ return String(n).padStart(2,"0"); };
  if(periode==="any") return {ini:y+"-01-01", fi:y+"-12-31"};
  if(/^T[1-4]$/.test(periode)){ var q=+periode[1], m1=(q-1)*3+1, m3=m1+2; return {ini:y+"-"+p2(m1)+"-01", fi:y+"-"+p2(m3)+"-"+p2(dm(m3))}; }
  if(/^M\d\d$/.test(periode)){ var m=+periode.slice(1); return {ini:y+"-"+p2(m)+"-01", fi:y+"-"+p2(m)+"-"+p2(dm(m))}; }
  return null;
}
function _llNomPeriode(c){
  var o=function(q){ return q+(q===1||q===3?"r":q===2?"n":"t"); };
  if(c.periode==="any") return "Any "+c.any;
  if(/^T/.test(c.periode||"")) return o(+c.periode[1])+" trimestre "+c.any;
  if(/^M/.test(c.periode||"")) return _LL_MESOS[+c.periode.slice(1)-1]+" "+c.any;
  return "";
}
function _llDataCobr(f){
  if(f.dataCobrament) return f.dataCobrament;
  var vs=vencimentsDe(f).filter(function(v){ return v.estat==="pagat" && v.dataCobrament; }).map(function(v){ return v.dataCobrament; }).sort();
  return vs.length ? vs[vs.length-1] : "";
}
function _llData(f, camp){
  if(camp==="venciment") return f.venciment||"";
  if(camp==="cobrament") return _llDataCobr(f);
  return f.dataEmissio||"";
}
function _llMateixTercer(f, nom){
  var tt=tercerPerNom(nom), nl=nom.trim().toLowerCase();
  return (tt && f.tercerId) ? f.tercerId===tt.id : (f.tercer||"").trim().toLowerCase()===nl;
}
/* Columnes del llistat (pantalla, PDF i Excel). t: d=data, m=import, p=percentatge, s=text. «sempre»: surt encara que sigui buida. */
var LL_COLS=[
  {k:"emissio", n:"Emissió", t:"d", sempre:1},
  {k:"num", n:"Núm.", t:"s", sempre:1},
  {k:"tipusTxt", n:"Tipus", t:"s"},
  {k:"tercer", n:"Tercer", t:"s", sempre:1},
  {k:"nif", n:"NIF", t:"s"},
  {k:"poblacio", n:"Població", t:"s"},
  {k:"ref", n:"Referència / descripció", t:"s"},
  {k:"fam", n:"Família / grup", t:"s"},
  {k:"forma", n:"Forma pag.", t:"s"},
  {k:"base", n:"Base", t:"m", tot:1, sempre:1},
  {k:"ivaPct", n:"% IVA", t:"p"},
  {k:"iva", n:"IVA", t:"m", tot:1, sempre:1},
  {k:"ret", n:"Retenció IRPF", t:"m", tot:1},
  {k:"supl", n:"Suplerts", t:"m", tot:1},
  {k:"total", n:"Total", t:"m", tot:1, sempre:1},
  {k:"venc", n:"Venciment", t:"d", sempre:1},
  {k:"trams", n:"Trams", t:"s"},
  {k:"cobrat", n:"Cobrat / pagat", t:"d"},
  {k:"estat", n:"Estat", t:"s", sempre:1},
  {k:"pendent", n:"Pendent", t:"m", tot:1, sempre:1},
  {k:"remesa", n:"Remesa", t:"s"},
  {k:"notes", n:"Notes", t:"s"}
];
function llistatFiltra(c){
  var today=todayISO(), r2=function(x){ return Math.round(x*100)/100; };
  var fs=(state.factures||[]).filter(function(f){
    if(!f) return false;
    if(c.tipus!=="tots" && f.tipus!==c.tipus) return false;
    if(!c.proformes && esProforma(f)) return false;
    if(c.tercer && !_llMateixTercer(f, c.tercer)) return false;
    var d=_llData(f, c.camp); if(!d) return false;
    if(c.ini && d<c.ini) return false;
    if(c.fi && d>c.fi) return false;
    var tancada=estatTancat(f);
    if(c.estat==="pendents" && tancada) return false;
    if(c.estat==="saldades" && !tancada) return false;
    if(c.estat==="vencudes" && (tancada || !f.venciment || f.venciment>=today)) return false;
    return true;
  });
  var rows=fs.map(function(f){
    var t=f.tercerId?findTercer(f.tercerId):tercerPerNom(f.tercer), vs=Array.isArray(f.venciments)?f.venciments:null;
    var rem=f.remesaId?remesaDe(f.remesaId):null, prov=(f.tipus==="proveidor");
    var ivaPct=(f.ivaPct!=null)?f.ivaPct:((f.base&&f.iva!=null)?Math.round(f.iva/f.base*1000)/10:null);
    return { id:f.id, data:_llData(f,c.camp), emissio:f.dataEmissio||"", num:f.num||"", tipus:f.tipus, tipusTxt:prov?"Proveïdor":"Client",
      tercer:f.tercer||"", nif:(t&&t.nif)||"", poblacio:(t&&t.poblacio)||"", ref:f.referencia||"", fam:(prov?f.grup:f.familia)||"",
      forma:f.formaPagament||"", base:(f.base!=null)?r2(f.base):null, ivaPct:ivaPct, iva:(f.iva!=null)?r2(f.iva):null,
      ret:prov?(retencioDe(f)||null):null, supl:prov?(suplertsDe(f)||null):null, total:r2(+f.import||0), venc:f.venciment||"",
      trams:(vs&&vs.length>1)?(vs.filter(function(v){ return v.estat==="pagat"; }).length+"/"+vs.length+" saldats"):"",
      cobrat:_llDataCobr(f), estat:estatDisplay(f).label+(esProforma(f)?" · proforma":""),
      pendent:estatTancat(f)?0:r2(importPendent(f)), remesa:rem?(fdate(rem.data)+(rem.entitat?" · "+rem.entitat:"")):"", notes:(f.notes||"").replace(/\s+/g," ").trim() };
  });
  /* ordre: per defecte la data que mana i el número; clicant una capçalera, per aquella columna */
  var o=c.ordre, col=o?LL_COLS.filter(function(x){ return x.k===o.k; })[0]:null;
  var cmpCol=function(a,b){
    if(!col) return 0;
    var va=a[col.k], vb=b[col.k];
    if(col.t==="m"||col.t==="p"){ va=(va==null?-Infinity:va); vb=(vb==null?-Infinity:vb); return va-vb; }
    return String(va||"").localeCompare(String(vb||""), "ca", {numeric:true});
  };
  rows.sort(function(a,b){
    if(c.agrupar){ var ta=a.tercer.toLowerCase(), tb=b.tercer.toLowerCase(); if(ta!==tb) return ta<tb?-1:1; }
    var x=cmpCol(a,b); if(x) return (o.dir<0?-x:x);
    if(a.data!==b.data) return a.data<b.data?-1:1;
    return String(a.num).localeCompare(String(b.num), "ca", {numeric:true});
  });
  var sumar=function(llista){ var s={n:llista.length}; LL_COLS.forEach(function(cc){ if(cc.tot){ s[cc.k]=r2(llista.reduce(function(a,r){ return a+(r[cc.k]||0); },0)); } }); return s; };
  var tot=sumar(rows); tot.senseBase=rows.filter(function(r){ return r.base==null; }).length;
  var grups=[];
  if(c.agrupar){ var cur=null; rows.forEach(function(r){ if(!cur || cur.tercer.toLowerCase()!==r.tercer.toLowerCase()){ cur={tercer:r.tercer, rows:[]}; grups.push(cur); } cur.rows.push(r); });
    grups.forEach(function(g){ var s=sumar(g.rows); for(var k in s) g[k]=s[k]; }); }
  /* columnes visibles: les «sempre» i les que tenen alguna dada; Tipus només si es llisten clients i proveïdors */
  var cols=LL_COLS.filter(function(cc){
    if(cc.k==="tipusTxt") return c.tipus==="tots";
    if(cc.sempre) return true;
    return rows.some(function(r){ var v=r[cc.k]; return v!=null && v!=="" && v!==0; });
  });
  return { c:c, rows:rows, tot:tot, grups:grups, cols:cols };
}
function _llCampNom(c){ return {emissio:"data d'emissió", venciment:"data de venciment", cobrament:(c.tipus==="proveidor"?"data de pagament":c.tipus==="client"?"data de cobrament":"data de cobrament / pagament")}[c.camp]; }
function _llTitol(c){
  var qui = c.tipus==="client" ? "Factures de clients" : c.tipus==="proveidor" ? "Factures de proveïdors" : "Factures de clients i proveïdors";
  return qui + (c.tercer ? " · "+c.tercer : "");
}
function _llSubtitol(c){
  var est={totes:"", pendents:" · només pendents", saldades:" · només "+(c.tipus==="proveidor"?"pagades":c.tipus==="client"?"cobrades":"cobrades / pagades"), vencudes:" · només vençudes"}[c.estat];
  var pn=_llNomPeriode(c);
  return (pn?pn+" · ":"")+"del "+fdate(c.ini)+" al "+fdate(c.fi)+" (per "+_llCampNom(c)+")"+est+(c.proformes?" · inclou proformes":"")+(c.agrupar?" · agrupat per tercer":"");
}
function _llFmt(col, v, html){
  if(v==null || v==="") return "";
  if(col.t==="d") return fdate(v);
  if(col.t==="m") return (v===0 && col.k==="pendent") ? "" : eur(v);
  if(col.t==="p") return String(v).replace(".",",")+" %";
  return html ? esc(v) : String(v);
}

function exportarLlistatXLSX(L){
  var c=L.c, t=L.tot, cols=L.cols, S={txt:0, money:1, bold:2, hdr:3, moneyB:4}, rows=[];
  rows.push([{v:empresaNomExtracte(),t:"s",s:S.bold}]);
  rows.push([{v:_llTitol(c),t:"s",s:S.bold}]);
  rows.push([{v:_llSubtitol(c)+"  ·  Imports en euros",t:"s"}]);
  rows.push([]);
  rows.push(cols.map(function(cc){ return {v:cc.n,t:"s",s:S.hdr}; }));
  var cel=function(cc, v){
    if(cc.t==="m") return (v==null||(v===0&&cc.k==="pendent"))?{v:"",t:"s"}:{v:v,t:"n",s:S.money};
    if(cc.t==="p") return (v==null)?{v:"",t:"s"}:{v:v,t:"n"};
    if(cc.t==="d") return {v:v?fdate(v):"",t:"s"};
    return {v:v==null?"":String(v),t:"s"};
  };
  var fila=function(r){ return cols.map(function(cc){ return cel(cc, r[cc.k]); }); };
  var tfila=function(etq, s){ return cols.map(function(cc,i){ if(i===0) return {v:etq,t:"s",s:S.bold}; if(cc.tot) return {v:s[cc.k]||0,t:"n",s:S.moneyB}; return {v:"",t:"s"}; }); };
  if(c.agrupar) L.grups.forEach(function(g){ g.rows.forEach(function(r){ rows.push(fila(r)); }); rows.push(tfila("Subtotal "+g.tercer+" ("+g.n+")", g)); rows.push([]); });
  else L.rows.forEach(function(r){ rows.push(fila(r)); });
  rows.push(tfila("TOTAL ("+t.n+" factures)", t));
  var sheetData=rows.map(function(cells,ri){ return '<row r="'+(ri+1)+'">'+cells.map(function(cc,ci){ return _cellXml(ci,ri+1,cc); }).join("")+'</row>'; }).join("");
  var amp={emissio:11, num:12, tipusTxt:10, tercer:34, nif:12, poblacio:16, ref:30, fam:16, forma:16, base:13, ivaPct:7, iva:12, ret:12, supl:12, total:13, venc:11, trams:12, cobrat:12, estat:16, pendent:13, remesa:22, notes:40};
  var colsXml='<cols>'+cols.map(function(cc,i){ return '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+(amp[cc.k]||12)+'" customWidth="1"/>'; }).join("")+'</cols>';
  var sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="5" topLeftCell="A6" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+colsXml+'<sheetData>'+sheetData+'</sheetData></worksheet>';
  exportarXLSXGeneric(sheet, "Factures", _llNomFitxer(c,"xlsx"));
  toast("Excel generat ("+t.n+" factures)");
}
