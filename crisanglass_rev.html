<style>
  :root{
    --bg:#f5f7fa; --surface:#ffffff; --ink:#1b2431; --muted:#647089;
    --border:#e3e8ef; --border-strong:#cbd4e1;
    --accent:#3d5a80; --accent-ink:#ffffff; --accent-soft:#eef2f7;
    /* estats */
    --e-emesa-bg:#eef1f5; --e-emesa-fg:#4b5768;
    --e-rebuda-bg:#fdf0dc; --e-rebuda-fg:#b45309;
    --e-remesa-bg:#fdf3e3; --e-remesa-fg:#b45309;
    --e-cobrada-bg:#e7f5ec; --e-cobrada-fg:#15803d;
    --e-vencuda-bg:#fdeaea; --e-vencuda-fg:#b91c1c;
    --pos:#15803d; --neg:#b3382f;
    --radius:9px; --radius-sm:6px;
    font-synthesis:none;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit; cursor:pointer}

  /* ---- Layout ---- */
  header.top{
    position:sticky; top:0; z-index:20; background:var(--surface);
    border-bottom:1px solid var(--border); padding:10px 18px;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:baseline; gap:9px}
  .brand h1{font-size:16px; margin:0; letter-spacing:-.2px; font-weight:650}
  .brand .tag{font-size:11px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.7px}
  .tabs{display:flex; gap:2px; margin-left:6px}
  .tab{
    border:none; background:transparent; color:var(--muted); font-weight:600;
    padding:7px 13px; border-radius:var(--radius-sm); font-size:13px;
  }
  .tab:hover{background:var(--accent-soft); color:var(--ink)}
  .tab.active{background:var(--accent); color:var(--accent-ink)}
  .top-right{margin-left:auto; display:flex; gap:8px; align-items:center}

  main{padding:18px; max-width:1440px; margin:0 auto}

  /* ---- Buttons ---- */
  .btn{
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
    padding:7px 12px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.07); color:#fff}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--muted)}
  .btn.ghost:hover{background:var(--accent-soft); color:var(--ink)}
  .btn.sm{padding:4px 9px; font-size:12px}
  .btn.danger:hover{border-color:var(--neg); color:var(--neg)}

  /* ---- Cards / resum ---- */
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:18px}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px}
  .card .k{font-size:11px; color:var(--muted); font-weight:650; text-transform:uppercase; letter-spacing:.6px}
  .card .v{font-size:24px; font-weight:680; margin-top:6px; letter-spacing:-.5px}
  .card .s{font-size:12px; color:var(--muted); margin-top:3px}
  .card.accent{border-left:3px solid var(--accent)}
  .card .v.pos{color:var(--pos)} .card .v.neg{color:var(--neg)}

  /* ---- Toolbar ---- */
  .toolbar{display:flex; gap:10px; align-items:center; flex-wrap:wrap; position:sticky; top:var(--header-h,91px); z-index:15; background:var(--bg); margin:0 0 12px; padding:9px 0; box-shadow:0 8px 10px -8px rgba(23,32,45,.10)}
  .flexbreak{flex-basis:100%; height:0; margin:0}
  #btn-undo,#btn-redo,#btn-historial{background:var(--accent-soft); border:1px solid var(--border-strong); color:var(--accent); font-size:15px; padding:3px 10px; line-height:1.1}
  #btn-undo:hover:not(:disabled),#btn-redo:hover:not(:disabled),#btn-historial:hover{background:#dfe7f1}
  #btn-undo:disabled,#btn-redo:disabled{opacity:.3; cursor:default}
  #app > .panel{overflow:visible}
  #app > .panel > table thead th{top:var(--sticky-top,140px); z-index:6}
  #app > .panel > table thead tr:first-child th:first-child{border-top-left-radius:8px}
  #app > .panel > table thead tr:first-child th:last-child{border-top-right-radius:8px}
  .toolbar .spacer{flex:1}
  .seg{display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--radius-sm); overflow:hidden}
  .seg button{border:none; background:var(--surface); color:var(--muted); padding:6px 11px; font-size:12px; font-weight:600}
  .seg button.active{background:var(--accent); color:#fff}
  input[type=text].search, select.filter{
    border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:6px 10px;
    font-size:13px; font-family:inherit; background:var(--surface); color:var(--ink);
  }
  input[type=text].search{min-width:200px}
  .daterange{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); font-weight:600}
  .daterange input[type=date]{border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:5px 8px; font-size:12.5px; font-family:inherit; background:var(--surface); color:var(--ink)}
  tr.mes td{background:#eef2f7; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); padding:6px 12px}
  tfoot td{border-top:2px solid var(--border-strong); padding:9px 12px; background:#fafbfc}
  .anblock{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px}
  .anh{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:10px}
  .anh .leg{font-weight:600; text-transform:none; letter-spacing:0; font-size:12px; color:var(--muted); display:flex; gap:14px}
  .sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle}

/* ═════════════ Memòria del navegador (IndexedDB) ═════════════ */
function idb(nomDB, store){
  return new Promise(function(res, rej){
    var r = indexedDB.open(nomDB, 1);
    r.onupgradeneeded = function(e){ var d = e.target.result; if(!d.objectStoreNames.contains(store)) d.createObjectStore(store); };
    r.onsuccess = function(e){ res(e.target.result); };
    r.onerror = function(e){ rej(e.target.error); };
  });
}
function idbGet(nomDB, store, clau){
  return idb(nomDB, store).then(function(db){ return new Promise(function(res, rej){
    var rq = db.transaction(store, "readonly").objectStore(store).get(clau);
    rq.onsuccess = function(){ res(rq.result == null ? null : rq.result); }; rq.onerror = function(e){ rej(e.target.error); };
  }); });
}
function idbSet(nomDB, store, clau, val){
  return idb(nomDB, store).then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction(store, "readwrite");
    if(val === undefined) tx.objectStore(store).delete(clau); else tx.objectStore(store).put(val, clau);
    tx.oncomplete = function(){ res(true); }; tx.onerror = function(e){ rej(e.target.error); };
  }); });
}
N.idb = {get:idbGet, set:idbSet};

  /* desfer:false = l'app no té desfer. v1.1: ↶ ↷ surten sempre a la barra, encara que l'app tingui els seus (barraDesfer s'ignora). */
  if(CFG && CFG.desfer === false){ B.desfes.style.display = "none"; B.refes.style.display = "none"; }
  if(N.IS_REV) cinta("cuina", "CUINA · _rev");
}
/* La cinta (CUINA / MIRANT) va dins de la barra, al davant: així mai tapa res de l'app. */
function cinta(tipus, text){
  var c = $("pn-cinta"), barra = $("pn-barra");
  if(!text){ if(c) c.parentNode.removeChild(c); return; }
  if(!c){ c = document.createElement("span"); c.id = "pn-cinta"; if(barra) barra.insertBefore(c, barra.firstChild); else document.body.appendChild(c); }
  c.className = "pn-cinta " + tipus; c.textContent = text;
}
function pintaEstat(){
  if(!B.estat) return;
  var t = "", col = "#6b7280", brut = N.brut();
  if(ST.mode === "mirant"){ t = "👁 Mirant cuina · no es desa"; col = "#b91c1c"; }
  else if(ST.mode === "lliure"){ t = brut ? "● Sense projecte" : "Sense projecte"; }
  else if(ST.error){ t = "⚠ No desat"; col = "#b91c1c"; }
  else if(ST.desant){ t = "⟳ Desant…"; col = "#6b7280"; }
  else if(!ST.permis){ t = brut ? "● Sense carpeta" : "Sense carpeta"; col = "#b45309"; }
  else if(brut){ t = "● Canvis"; col = "#b45309"; }
  else if(ST.ultimDesat){ t = "✓ Desat " + ST.ultimDesat; col = "#15803d"; }
  else { t = "✓ Al dia"; col = "#15803d"; }
  B.estat.textContent = t; B.estat.style.color = col;
  if(ST.error) B.estat.title = ST.error; else B.estat.removeAttribute("title");
  B.desfes.disabled = !H.pila.length; B.refes.disabled = !H.futur.length;
  B.carpeta.style.display = (ST.projecte && !ST.permis) ? "" : "none";
  B.desa.disabled = (ST.mode !== "projecte");
  if(CFG && CFG.alEstat) try{ CFG.alEstat(N.estat()); }catch(e){}
  avisaCanal();
}

/* ═════════════ Desfer / refer ═════════════ */
/* Una FOTO és l'estat de les dades en text. Cada canvi real guarda la foto
   anterior a la pila; els canvis seguits del mateix gest (menys de 0,7 s i
   la mateixa etiqueta) s'ajunten en un sol pas. */
var H = {pila:[], futur:[], actual:null, tUlt:0, etUlt:""};
N.historial = H;
function foto(){
  try{ return CFG.foto ? CFG.foto() : clauDades(CFG.dades(ST.projecte)); }
  catch(e){ anotaError("foto(): " + e.message, "", 0, 0, e.stack); return H.actual; }
}
function clauDades(d){
  if(d && typeof d === "object"){ var c = {}; for(var k in d) if(k !== "desat") c[k] = d[k]; return JSON.stringify(c); }
  return JSON.stringify(d);
}
function posaFoto(f){
  N.carregant = true;
  try{ if(CFG.posaFoto) CFG.posaFoto(f); else CFG.carrega(JSON.parse(f)); }
  finally{ N.carregant = false; }
}
function fotoBase(){ H.actual = foto(); H.pila = []; H.futur = []; H.tUlt = 0; H.etUlt = ""; ST.desatFoto = H.actual; ST.calmaFins = Date.now() + CALMA_MS; }
/* CALMA: just després d'obrir, moltes apps acaben d'inicialitzar-se soles (llistes
   per defecte, normalitzacions). Aquests canvis no són de l'usuari: fins al primer
   clic o tecla (o 2 s), s'absorbeixen a la foto base i no marquen canvis ni desen.
   Així obrir un projecte mai crea un _rev ni un desat per si sol. */
var CALMA_MS = 2000;
function fiCalma(){ ST.calmaFins = 0; }
["pointerdown", "keydown", "input", "wheel"].forEach(function(ev){ document.addEventListener(ev, fiCalma, true); });
N.brut = function(){ return H.actual != null && ST.desatFoto != null && H.actual !== ST.desatFoto; };
N.canvi = function(etiqueta){
  if(N.carregant || !ST.iniciat) return;
  var f = foto();
  if(f == null || f === H.actual) return;
  if(ST.calmaFins && Date.now() < ST.calmaFins){ var eraNet = !N.brut(); H.actual = f; if(eraNet) ST.desatFoto = f; pintaEstat(); return; }
  var ara = Date.now(), et = etiqueta || "";
  var ajunta = (et === H.etUlt) && (ara - H.tUlt < AGRUPA_MS) && H.pila.length;
  if(!ajunta && H.actual != null){ H.pila.push(H.actual); if(H.pila.length > HISTO_MAX) H.pila.shift(); }
  H.futur = []; H.actual = f; H.tUlt = ara; H.etUlt = et;
  ST.error = null;
  programaRescat(); programaDesat(); pintaEstat();
};
function aplica(f, que){
  posaFoto(f);
  H.actual = f; H.tUlt = 0; H.etUlt = "";
  programaRescat(); programaDesat(); pintaEstat();
  if(CFG.alDesfer) try{ CFG.alDesfer(que); }catch(e){}
}
N.desfes = function(){
  if(CFG && CFG.desfer === false) return;
  if(!H.pila.length){ N.toast("No hi ha res més per desfer"); return; }
  H.futur.push(H.actual); aplica(H.pila.pop(), "desfer");
  N.toast("↶ Desfet" + (H.pila.length ? "" : " · no queda res més"), 1600);
};
N.refes = function(){
  if(CFG && CFG.desfer === false) return;
  if(!H.futur.length){ N.toast("No hi ha res per refer"); return; }
  H.pila.push(H.actual); aplica(H.futur.pop(), "refer");
  N.toast("↷ Refet" + (H.futur.length ? "" : " · no queda res més per refer"), 1600);
};

/* v1.2: salta(n) — n passos endavant (+) o enrere (−) d'un sol cop (una sola aplicació de la foto) */
N.salta = function(n){
  if(CFG && CFG.desfer === false) return;
  n = parseInt(n, 10) || 0; if(!n) return;
  if(n < 0){ n = Math.min(-n, H.pila.length); if(!n) return; for(var i = 0; i < n; i++){ H.futur.push(H.actual); H.actual = H.pila.pop(); } aplica(H.actual, "desfer"); }
  else { n = Math.min(n, H.futur.length); if(!n) return; for(var j = 0; j < n; j++){ H.pila.push(H.actual); H.actual = H.futur.pop(); } aplica(H.actual, "refer"); }
};

/* ═════════════ Rescat (còpia al navegador) ═════════════ */
var DB_RESCAT = "panell-nucli", ST_RESCAT = "rescat", _rescT = null;
function clauRescat(){ return [CFG.id, ST.projecte, N.IS_REV ? "rev" : "est"].join("|"); }
function programaRescat(){
  if(ST.mode !== "projecte") return;
  if(_rescT) clearTimeout(_rescT);
  _rescT = setTimeout(escriuRescat, 400);
}
function escriuRescat(){
  _rescT = null;
  if(ST.mode !== "projecte" || !ST.carregat || !N.brut()) return Promise.resolve();   /* v1.2: mai abans de carregar el disc */
  var r = {t:Date.now(), foto:H.actual, pila:RESCAT_PASSOS ? H.pila.slice(-RESCAT_PASSOS) : [], app:CFG.id, versio:CFG.versio};
  if(CFG.xifrat && XF.estat !== "sense"){   /* v1.3: dades protegides → el rescat també va xifrat (i, bloquejat, no se'n fa) */
    if(!XF.mk || XF.estat !== "obert") return Promise.resolve();
    return xfXifraText(JSON.stringify({foto:r.foto, pila:r.pila})).then(function(x){
      return idbSet(DB_RESCAT, ST_RESCAT, clauRescat(), {t:r.t, x:x, app:r.app, versio:r.versio}); }).catch(function(){});
  }
  return idbSet(DB_RESCAT, ST_RESCAT, clauRescat(), r).catch(function(){});
}
function esborraRescat(){ return idbSet(DB_RESCAT, ST_RESCAT, clauRescat(), undefined).catch(function(){}); }
function mirarRescat(dataFitxer){
  return idbGet(DB_RESCAT, ST_RESCAT, clauRescat()).catch(function(){ return null; }).then(function(r){
    if(r && r.x){   /* v1.3: rescat xifrat */
      if(!XF.mk) return null;
      return xfDesxifraText(r.x).then(function(t){ var o = JSON.parse(t); r.foto = o.foto; r.pila = o.pila; return r; }, function(){ return null; });
    }
    return r;
  }).then(function(r){
    if(!r || !r.foto || r.foto === H.actual) return;
    if(dataFitxer && r.t <= dataFitxer) return esborraRescat();
    return N.modal({titol:"Hi ha canvis sense desar",
      html:"L'última vegada, l'app es va tancar abans de desar uns canvis d'aquest projecte (del <b>" + esc(dataHora(r.t)) + "</b>).<br>Els vols recuperar?",
      botons:[{text:"Descartar-los", valor:false, cancel:true}, {text:"Recuperar-los", valor:true, principal:true}]}).then(function(si){
      if(!si) return esborraRescat();
      posaFoto(r.foto);
      H.pila = (r.pila || []).concat([H.actual]); H.futur = []; H.actual = r.foto; H.tUlt = 0;
      programaDesat(); pintaEstat();
      N.toast("Canvis recuperats");
    });
  });
}

/* ═════════════ Xifratge (v1.3 · només apps amb PANELL.app({xifrat:true})) ═════════════
   UNA contrasenya per a totes les apps de gestió. Una CLAU MESTRA aleatòria (AES-GCM 256) xifra
   les dades; la clau mestra es guarda «embolicada» dues vegades al fitxer de claus comú
   (dades/gestio_clau.json): amb la CONTRASENYA (PBKDF2-SHA256, 600.000 voltes) i amb la CLAU DE
   RESCAT de paper. Cada fitxer xifrat porta també una còpia d'aquests embolcalls: si un dia es
   perdés gestio_clau.json, el fitxer es pot obrir igual amb la contrasenya o amb la de rescat.
   Canviar la contrasenya només torna a embolicar la clau mestra (les dades no es tornen a xifrar).
   Res surt de l'ordinador: és el xifratge que porta el navegador (WebCrypto), sense internet.
   · Fitxer xifrat: {"panell_xifrat":1, app, kid, clau:{kid,pw,rescat}, iv, ct}
   · Rescat del navegador (IndexedDB): també xifrat. Si les dades estan bloquejades, no se'n fa.
   · La contrasenya es demana SEMPRE en obrir l'app (res es recorda entre obertures). 🔒 → «Bloquejar ara»
     la torna a demanar sense tancar l'app. */
var XF = {mk:null, kid:null, clau:null, estat:"off"};   /* estat: off · sense · obert · bloquejat */
var XF_ITER = 600000, XF_ITER_R = 200000, DB_XF = "panell-nucli-clau", ST_XF = "claus", K_XF = "gestio";
var XF_B32 = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
var _TE = new TextEncoder(), _TD = new TextDecoder();
function xfCami(){ return (CFG && typeof CFG.xifrat === "string") ? CFG.xifrat : "dades/gestio_clau.json"; }
function xfSubtle(){ if(!(window.crypto && crypto.subtle)) throw new Error("aquest navegador no pot xifrar (cal obrir el PANELL des de localhost)"); return crypto.subtle; }
function xfB64(buf){ var u = new Uint8Array(buf), s = "", CH = 0x8000; for(var i = 0; i < u.length; i += CH) s += String.fromCharCode.apply(null, u.subarray(i, i + CH)); return btoa(s); }
function xfDeB64(t){ var s = atob(t), u = new Uint8Array(s.length); for(var i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
function xfAleat(n){ return crypto.getRandomValues(new Uint8Array(n)); }
function xfKek(secret, salt, iter){
  var S = xfSubtle();
  return S.importKey("raw", _TE.encode(secret), "PBKDF2", false, ["deriveKey"]).then(function(k){
    return S.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:salt, iterations:iter}, k, {name:"AES-GCM", length:256}, false, ["encrypt", "decrypt"]); });
}
function xfGcm(key, bytes){ var iv = xfAleat(12); return xfSubtle().encrypt({name:"AES-GCM", iv:iv}, key, bytes).then(function(ct){ return {iv:xfB64(iv), ct:xfB64(ct)}; }); }
function xfDesGcm(key, o){ return xfSubtle().decrypt({name:"AES-GCM", iv:xfDeB64(o.iv)}, key, xfDeB64(o.ct)); }
function xfImporta(raw){ return xfSubtle().importKey("raw", raw, {name:"AES-GCM"}, false, ["encrypt", "decrypt"]); }
function xfKid(raw){ return xfSubtle().digest("SHA-256", raw).then(function(h){ return Array.prototype.map.call(new Uint8Array(h).slice(0, 8), function(x){ return (x < 16 ? "0" : "") + x.toString(16); }).join(""); }); }
function xfNetejaRescat(t){ return String(t || "").toUpperCase().replace(/[^A-Z0-9]/g, ""); }
function xfNovaRescat(){ var u = xfAleat(30), s = ""; for(var i = 0; i < 30; i++){ s += XF_B32[u[i] % 32]; if(i % 5 === 4 && i < 29) s += "-"; } return s; }
/* embolicar la clau mestra (raw) amb un secret → {salt, iter, iv, ct} */
function xfEmbolica(raw, secret, iter){
  var salt = xfAleat(16);
  return xfKek(secret, salt, iter).then(function(k){ return xfGcm(k, raw); }).then(function(o){ return {salt:xfB64(salt), iter:iter, iv:o.iv, ct:o.ct}; });
}
/* desembolicar → raw (o error si el secret no és bo) */
function xfDesembolica(emb, secret){
  return xfKek(secret, xfDeB64(emb.salt), emb.iter).then(function(k){ return xfDesGcm(k, emb); }).then(function(raw){ return new Uint8Array(raw); });
}
function xfObreAmbRaw(raw, clau){
  return xfKid(raw).then(function(kid){
    if(clau && clau.kid && clau.kid !== kid) throw new Error("la clau no correspon a aquestes dades");
    return xfImporta(raw).then(function(k){ XF.mk = k; XF.kid = kid; XF.estat = "obert"; return true; });
  });
}
/* ── fitxer de claus comú ── */
function xfLlegeixClau(){
  var c = xfCami(), i = c.lastIndexOf("/");
  return F.dir(ST.arrel, c.slice(0, i), false).then(function(d){ return F.llegeix(d, c.slice(i + 1)); })
    .then(function(t){ var o = JSON.parse(t); return (o && o.panell_clau && o.pw && o.rescat) ? o : null; }, function(){ return null; });
}
function xfEscriuClau(o){
  var c = xfCami(), i = c.lastIndexOf("/");
  return F.dir(ST.arrel, c.slice(0, i), true).then(function(d){ return F.escriuSegur(d, c.slice(i + 1), JSON.stringify(o, null, 2)); });
}
/* ── v1.3: res es recorda al navegador; només s'esborra el que hi pogués quedar de la prova pilot ── */
function xfOblida(){ return idbSet(DB_XF, ST_XF, K_XF, undefined).catch(function(){}); }
/* ── diàleg amb camps (es queda obert si hi ha error) ── */
function xfForm(o){
  posaEstil();
  return new Promise(function(res){
    var f = document.createElement("div"); f.className = "pn-fons";
    f.innerHTML = '<div class="pn-modal" role="dialog"><h3>' + esc(o.titol) + '</h3><div class="pn-cos">' + o.html +
      '<div class="pn-xf-err" style="color:#b91c1c;font-weight:600;margin-top:8px;display:none"></div></div><div class="pn-peu">' +
      o.botons.map(function(x, i){ return '<button data-i="' + i + '"' + (x.principal ? ' class="pn-prin"' : "") + ">" + esc(x.text) + "</button>"; }).join("") + "</div></div>";
    var err = f.querySelector(".pn-xf-err"), ocupat = false;
    var acaba = function(v){ document.removeEventListener("keydown", tecla, true); if(f.parentNode) f.parentNode.removeChild(f); res(v); };
    var prem = function(b){
      if(ocupat) return;
      if(b.cancel || !o.valida) return acaba(b.valor);
      ocupat = true; err.style.display = "block"; err.style.color = "#6b7280"; err.textContent = "⟳ Un moment…";
      setTimeout(function(){
        Promise.resolve().then(function(){ return o.valida(b.valor, f); }).then(function(r){
          ocupat = false;
          if(r && r.error){ err.style.color = "#b91c1c"; err.textContent = r.error; return; }
          acaba(r && r.valor !== undefined ? r.valor : b.valor);
        }, function(e){ ocupat = false; err.style.color = "#b91c1c"; err.textContent = (e && e.message) || String(e); });
      }, 30);
    };
    var tecla = function(e){
      if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); var c = o.botons.filter(function(x){ return x.cancel; })[0]; if(c) prem(c); }
      else if(e.key === "Enter" && e.target && e.target.tagName === "INPUT" && e.target.type !== "checkbox"){ e.preventDefault(); var p = o.botons.filter(function(x){ return x.principal; })[0]; if(p) prem(p); }
    };
    f.querySelectorAll(".pn-peu button").forEach(function(btn){ btn.addEventListener("click", function(){ prem(o.botons[+btn.getAttribute("data-i")]); }); });
    xfUlls(f);
    document.addEventListener("keydown", tecla, true);
    document.body.appendChild(f);
    var inp = f.querySelector("input"); if(inp) inp.focus();
  });
}
/* v1.4 · botó 👁 al costat de cada camp de contrasenya: per defecte amagada; un clic la mostra, un altre l'amaga */
function xfUlls(f){
  f.querySelectorAll("input[type=password]").forEach(function(inp){
    var w = document.createElement("div"); w.style.cssText = "display:flex;gap:6px;align-items:center;margin:3px 0 9px";
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    inp.style.margin = "0"; inp.style.width = "auto"; inp.style.flex = "1"; inp.style.minWidth = "0";
    var b = document.createElement("button"); b.type = "button"; b.className = "pn-b pn-ull"; b.textContent = "👁"; b.title = "Mostrar la contrasenya";
    b.style.cssText = "flex:0 0 auto;padding:6px 9px;font-size:15px;line-height:1";
    b.addEventListener("click", function(){
      var veure = inp.type === "password";
      inp.type = veure ? "text" : "password";
      b.textContent = veure ? "🙈" : "👁"; b.title = veure ? "Amagar la contrasenya" : "Mostrar la contrasenya";
      inp.focus();
    });
    w.appendChild(b);
  });
}
function xfVal(f, id){ var e = f.querySelector("#" + id); return e ? (e.type === "checkbox" ? e.checked : e.value) : ""; }
var XF_INP = 'style="width:100%;box-sizing:border-box;padding:7px 9px;margin:3px 0 9px;border:1px solid #cbd5e1;border-radius:7px;font:14px system-ui,Arial,sans-serif"';
function xfNovaContra(f){
  var a = xfVal(f, "xf-n1"), b = xfVal(f, "xf-n2");
  if(a.length < 8) return "La contrasenya ha de tenir com a mínim 8 caràcters.";
  if(a !== b) return "Les dues contrasenyes no coincideixen.";
  return "";
}
/* ── demanar la contrasenya (o la clau de rescat) → clau mestra en brut (Uint8Array) o null ── */
function xfDemanaRaw(clau, motiu){
  return xfForm({titol:"🔒 Dades protegides",
    html:(motiu ? "<p style='margin:0 0 8px'>" + motiu + "</p>" : "") +
      "Escriu la contrasenya de les apps de gestió:<input id='xf-pw' type='password' autocomplete='current-password' " + XF_INP + ">",
    botons:[{text:"He oblidat la contrasenya", valor:"oblit"}, {text:"Cancel·lar", valor:null, cancel:true}, {text:"Obrir", valor:"obre", principal:true}],
    valida:function(v, f){
      if(v === "oblit") return {valor:"oblit"};
      var pw = xfVal(f, "xf-pw"); if(!pw) return {error:"Escriu la contrasenya."};
      return xfDesembolica(clau.pw, pw).then(function(raw){ return {valor:raw}; }, function(){ return {error:"La contrasenya no és correcta."}; });
    }}).then(function(v){
    if(v === "oblit") return xfRescatRaw(clau).then(function(raw){ return raw || xfDemanaRaw(clau, motiu); });
    return (v instanceof Uint8Array) ? v : null;
  });
}
function xfDesbloqueja(clau, motiu){
  return xfDemanaRaw(clau, motiu).then(function(raw){ return raw ? xfObreAmbRaw(raw, clau) : false; });
}
/* Contrasenya oblidada: amb la clau de rescat de paper, se'n posa una de nova (al fitxer de claus comú) */
function xfRescatRaw(clau){
  return xfForm({titol:"Recuperar amb la clau de rescat",
    html:"Escriu la <b>clau de rescat</b> (la del paper; els guions i les majúscules no compten):<input id='xf-r' autocomplete='off' spellcheck='false' " + XF_INP + ">" +
      "Contrasenya nova:<input id='xf-n1' type='password' autocomplete='new-password' " + XF_INP + ">Repeteix-la:<input id='xf-n2' type='password' autocomplete='new-password' " + XF_INP + ">",
    botons:[{text:"Tornar", valor:null, cancel:true}, {text:"Recuperar", valor:"ok", principal:true}],
    valida:function(v, f){
      var e = xfNovaContra(f); if(e) return {error:e};
      var r = xfNetejaRescat(xfVal(f, "xf-r")); if(r.length !== 30) return {error:"La clau de rescat té 30 lletres i números (sense comptar els guions)."};
      return xfDesembolica(clau.rescat, r).then(function(raw){
        var comuna = !XF.clau || XF.clau.kid === clau.kid;
        if(!comuna) return {valor:raw};
        return xfEmbolica(raw, xfVal(f, "xf-n1"), XF_ITER).then(function(pw){
          var nova = {panell_clau:1, creat:clau.creat || new Date().toISOString(), canviat:new Date().toISOString(), kid:clau.kid, pw:pw, rescat:clau.rescat};
          if(XF.clau && XF.clau.desactivat){ nova.desactivat = true; nova.desactivatEl = XF.clau.desactivatEl; }
          return xfEscriuClau(nova).then(function(){ XF.clau = nova; N.toast("🔓 Contrasenya nova posada. Guarda-la bé."); return {valor:raw}; });
        });
      }, function(){ return {error:"La clau de rescat no és correcta."}; });
    }}).then(function(v){ return (v instanceof Uint8Array) ? v : null; });
}
/* En obrir l'app: si hi ha fitxer de claus, cal la contrasenya ABANS de llegir res */
function xfPrepara(){
  if(!CFG || !CFG.xifrat) return Promise.resolve();
  if(XF.mk) return Promise.resolve();
  return xfLlegeixClau().then(function(clau){
    XF.clau = clau; XF.desactivat = !!(clau && clau.desactivat);
    if(!clau || clau.desactivat){ XF.estat = "sense"; pintaXf(); return; }   /* sense protecció (mai activada, o treta) */
    /* Decisió d'Andreu (05/10/2026): la contrasenya es demana SEMPRE en obrir (res de «recordar-la»).
       Per si de cas, s'esborra qualsevol clau recordada de la prova pilot. */
    return xfOblida().then(function(){ return xfDesbloqueja(clau); }).then(function(ok){
      pintaXf();
      if(!ok){ XF.estat = "bloquejat"; pintaXf(); var e = new Error("les dades estan protegides amb contrasenya i no s'han obert"); e.xfBloquejat = true; throw e; }
    });
  });
}
/* Per a l'app: llegir un altre fitxer de dades (p. ex. Pressupostos → Tresoreria). Retorna Promise(text en clar);
   si el fitxer és xifrat i encara no s'ha entrat la contrasenya, la demana. */
N.desxifra = function(text){ return xfDesxifraText(text); };
N.esXifrat = function(text){ return xfEsXifrat(text); };
function xfEsXifrat(text){ return typeof text === "string" && text.slice(0, 40).indexOf('"panell_xifrat"') >= 0; }
function xfXifraText(text){
  return xfGcm(XF.mk, _TE.encode(text)).then(function(o){
    var c = XF.clau || {};
    return JSON.stringify({panell_xifrat:1, app:CFG.id, kid:XF.kid, clau:{kid:XF.kid, pw:c.pw, rescat:c.rescat}, iv:o.iv, ct:o.ct});
  });
}
/* text del disc → text en clar (si no és xifrat, tal qual). Si el fitxer és d'una altra clau (p. ex. xifrat abans
   de treure o tornar a posar la contrasenya), es demana la contrasenya d'aquell fitxer. */
function xfDesxifraText(text){
  if(!xfEsXifrat(text)) return Promise.resolve(text);
  var env = JSON.parse(text);
  var pk = (XF.mk && env.kid === XF.kid) ? Promise.resolve(XF.mk)
    : xfDemanaRaw(env.clau, (XF.estat === "sense" || XF.mk) ? "Aquest fitxer encara està xifrat amb la contrasenya d'abans." : "Aquest fitxer està xifrat.").then(function(raw){
        if(!raw) return null;
        return xfKid(raw).then(function(kid){
          if(env.kid && env.kid !== kid) throw new Error("la clau no correspon a aquest fitxer");
          return xfImporta(raw).then(function(k){
            if(!XF.mk && !XF.desactivat){   /* protecció activa però sense fitxer de claus (perdut): s'adopta la del fitxer i es refà */
              XF.mk = k; XF.kid = kid; XF.estat = "obert";
              if(!XF.clau){ XF.clau = {panell_clau:1, creat:new Date().toISOString(), kid:kid, pw:env.clau.pw, rescat:env.clau.rescat}; xfEscriuClau(XF.clau).catch(function(){}); }
              pintaXf();
            }
            return k;
          });
        });
      });
  return pk.then(function(k){
    if(!k){ var e = new Error("fitxer xifrat i contrasenya no entrada"); e.xfBloquejat = true; throw e; }
    return xfDesGcm(k, env).then(function(b){ XF._llegitXifrat = true; return _TD.decode(b); });
  });
}
/* ── activar la protecció (la primera vegada) ── */
function xfActiva(){
  return xfLlegeixClau().then(function(ja){
    if(ja && !ja.desactivat){ XF.clau = ja; return xfDesbloqueja(ja, "Ja hi ha una contrasenya de gestió (d'una altra app). Entra-la per protegir també aquestes dades.").then(function(ok){ if(ok){ pintaXf(); return N.desa({manual:true}); } }); }
    return xfForm({titol:"🔒 Protegir les dades amb contrasenya",
      html:"Les dades d'aquesta app es desaran <b>xifrades</b>: sense la contrasenya, el fitxer no es pot llegir (ni al Dropbox, ni a la maleta, ni a les còpies)." +
        "<p style='margin:8px 0'>Serà <b>la mateixa contrasenya per a totes les apps de gestió</b>.</p>" +
        "Contrasenya (mínim 8 caràcters):<input id='xf-n1' type='password' autocomplete='new-password' " + XF_INP + ">Repeteix-la:<input id='xf-n2' type='password' autocomplete='new-password' " + XF_INP + ">",
      botons:[{text:"Cancel·lar", valor:null, cancel:true}, {text:"Continuar", valor:"ok", principal:true}],
      valida:function(v, f){ var e = xfNovaContra(f); return e ? {error:e} : {valor:xfVal(f, "xf-n1")}; }
    }).then(function(pw){
      if(!pw) return;
      var raw = xfAleat(32), rescat = xfNovaRescat();
      return xfMostraRescat(rescat).then(function(ok){
        if(!ok){ N.toast("No s'ha activat la protecció."); return; }
        return Promise.all([xfEmbolica(raw, pw, XF_ITER), xfEmbolica(raw, xfNetejaRescat(rescat), XF_ITER_R), xfKid(raw)]).then(function(r){
          var clau = {panell_clau:1, creat:new Date().toISOString(), kid:r[2], pw:r[0], rescat:r[1]};
          return xfEscriuClau(clau).then(function(){ XF.clau = clau; return xfObreAmbRaw(raw, clau); });
        }).then(function(){ pintaXf(); return N.desa({manual:true}); }).then(function(){ N.toast("🔒 Protecció activada: les dades ja es desen xifrades.", 6000); });
      });
    });
  });
}
function xfMostraRescat(rescat){
  return xfForm({titol:"Clau de rescat — imprimeix-la i guarda-la",
    html:"Si un dia oblides la contrasenya, <b>només aquesta clau</b> permet recuperar les dades. Sense ella i sense la contrasenya, les dades es perden." +
      "<div style='margin:12px 0;padding:12px;border:2px dashed #1f5f99;border-radius:8px;text-align:center;font:700 19px/1.4 ui-monospace,Consolas,monospace;letter-spacing:1px'>" + esc(rescat) + "</div>" +
      "Guarda-la en paper, en un lloc segur i fora de l'ordinador. No la desis al Dropbox." +
      "<label style='font-size:13px;display:flex;gap:6px;align-items:center;margin-top:10px'><input id='xf-ok' type='checkbox'> L'he impresa o copiada i la tinc guardada</label>",
    botons:[{text:"Cancel·lar", valor:null, cancel:true}, {text:"🖨 Imprimir", valor:"imp"}, {text:"Activar la protecció", valor:"ok", principal:true}],
    valida:function(v, f){
      if(v === "imp"){ xfImprimeix(rescat); return {error:" "}; }
      if(!xfVal(f, "xf-ok")) return {error:"Marca la casella quan tinguis la clau guardada."};
      return {valor:true};
    }}).then(function(v){ return v === true; });
}
function xfImprimeix(rescat){
  var w = window.open("", "_blank", "width=700,height=500"); if(!w){ N.toast("El navegador no ha deixat obrir la finestra d'impressió."); return; }
  w.document.write("<!doctype html><meta charset='utf-8'><title>Clau de rescat PANELL</title><body style='font:15px Arial,sans-serif;padding:40px'>" +
    "<h2>PANELL · Clau de rescat de les apps de gestió</h2><p>Data: " + esc(new Date().toLocaleDateString("ca-ES")) + "</p>" +
    "<p style='font:700 26px Consolas,monospace;letter-spacing:2px;border:2px solid #000;padding:16px;text-align:center'>" + esc(rescat) + "</p>" +
    "<p>Serveix per recuperar les dades xifrades (Tresoreries, Pressupostos) si s'oblida la contrasenya:<br>a l'app, «He oblidat la contrasenya» → escriure aquesta clau → posar una contrasenya nova.</p>" +
    "<p><b>Guardar en un lloc segur. No desar-la a l'ordinador ni al Dropbox.</b></p></body>");

/* ── menú del botó 🔒 ── */
function xfMenu(){
  if(XF.estat === "sense") return xfActiva();
  if(XF.estat === "bloquejat") return N.modal({titol:"🔒 Dades bloquejades", html:"Torna a carregar la pàgina (F5) per entrar la contrasenya."});
  return N.modal({titol:"🔒 Protecció amb contrasenya",
    html:"Les dades d'aquesta app es desen <b>xifrades</b>.",
    botons:[{text:"Treure la contrasenya", valor:"treu"}, {text:"Canviar la contrasenya", valor:"canvia"}, {text:"Bloquejar ara", valor:"bloq"}, {text:"Tancar", valor:null, cancel:true, principal:true}]}).then(function(v){
    if(v === "treu") return xfTreu();
    if(v === "bloq") return N.desa({auto:true}).then(function(){ return xfOblida(); }).then(function(){ ST.sortint = true; location.reload(); });
    if(v === "canvia") return xfForm({titol:"Canviar la contrasenya",
      html:"Contrasenya actual:<input id='xf-pw' type='password' autocomplete='current-password' " + XF_INP + ">Contrasenya nova:<input id='xf-n1' type='password' autocomplete='new-password' " + XF_INP + ">Repeteix-la:<input id='xf-n2' type='password' autocomplete='new-password' " + XF_INP + ">" +
        "<small>Val per a totes les apps de gestió. La clau de rescat de paper continua sent la mateixa.</small>",
      botons:[{text:"Cancel·lar", valor:null, cancel:true}, {text:"Canviar", valor:"ok", principal:true}],
      valida:function(v, f){
        var e = xfNovaContra(f); if(e) return {error:e};
        return xfLlegeixClau().then(function(clau){
          clau = clau || XF.clau;
          return xfDesembolica(clau.pw, xfVal(f, "xf-pw")).then(function(raw){
            return xfEmbolica(raw, xfVal(f, "xf-n1"), XF_ITER).then(function(pw){
              var nova = {panell_clau:1, creat:clau.creat, canviat:new Date().toISOString(), kid:clau.kid, pw:pw, rescat:clau.rescat};
              return xfEscriuClau(nova).then(function(){ XF.clau = nova; return N.desa({manual:true}); }).then(function(){ return {valor:"ok"}; });
            });
          }, function(){ return {error:"La contrasenya actual no és correcta."}; });
        });
      }}).then(function(v){ if(v === "ok") N.toast("🔒 Contrasenya canviada (per a totes les apps de gestió)."); });
  });
}
/* ── treure la protecció (totes les apps de gestió) ── */
function xfTreu(){
  return xfForm({titol:"Treure la contrasenya",
    html:"Les dades de <b>totes les apps de gestió</b> es tornaran a desar <b>sense xifrar</b> i ja no es demanarà la contrasenya." +
      "<p style='margin:8px 0'>Aquesta app es desa en clar ara mateix. Cada una de les altres ho farà la propera vegada que l'obris (et demanarà la contrasenya aquell últim cop).</p>" +
      "Per confirmar-ho, escriu la contrasenya actual:<input id='xf-pw' type='password' autocomplete='current-password' " + XF_INP + ">",
    botons:[{text:"Cancel·lar", valor:null, cancel:true}, {text:"Treure la contrasenya", valor:"ok", principal:true}],
    valida:function(v, f){
      return xfLlegeixClau().then(function(clau){
        clau = clau || XF.clau;
        return xfDesembolica(clau.pw, xfVal(f, "xf-pw")).then(function(){
          var nova = {}; for(var k in clau) nova[k] = clau[k];
          nova.desactivat = true; nova.desactivatEl = new Date().toISOString();
          return xfEscriuClau(nova).then(function(){ XF.clau = nova; return {valor:"ok"}; });
        }, function(){ return {error:"La contrasenya no és correcta."}; });
      });
    }}).then(function(v){
    if(v !== "ok") return;
    XF.desactivat = true; XF.estat = "sense"; XF.mk = null; XF.kid = null; pintaXf();
    return N.desa({manual:true}).then(function(){ N.toast("🔓 Contrasenya treta: les dades es desen sense xifrar.", 6000); });
  });
}
function pintaXf(){
  var b = $("pn-xf"); if(!b) return;
  b.style.display = (CFG && CFG.xifrat) ? "" : "none";
  var t = {sense:["🔓", "Dades sense protegir · clica per posar-hi contrasenya", "#b45309"], obert:["🔒", "Dades protegides amb contrasenya", "#15803d"],
           bloquejat:["⛔", "Dades bloquejades (contrasenya no entrada)", "#b91c1c"], off:["🔒", "", ""]}[XF.estat] || ["🔒", "", ""];
  b.textContent = t[0]; b.title = t[1]; b.style.color = t[2];
}

/* ═════════════ Desar ═════════════ */
function nomFitxer(rev){ return CFG.fitxer ? CFG.fitxer(ST.projecte, rev) : ST.projecte + (rev ? "_rev" : "") + ".json"; }
function camiProjecte(){ return CFG.carpetaDades ? String(CFG.carpetaDades).replace(/^\/+|\/+$/g, "") : "projectes/" + CFG.tipologia + "/" + ST.projecte + "/" + CFG.subcarpeta; }
function nomCarpeta(){ return CFG.subcarpeta || camiProjecte(); }
function dirProjecte(crea){ return CFG.dirProjecte ? Promise.resolve().then(function(){ return CFG.dirProjecte(ST.arrel, ST.projecte, crea); }) : F.dir(ST.arrel, camiProjecte(), crea); }
function programaDesat(){
  if(ST.mode !== "projecte") return;
  if(ST.timer) clearTimeout(ST.timer);
  ST.timer = setTimeout(function(){ ST.timer = null; N.desa({auto:true}); }, AUTODESA_MS);
}
/* desa({auto|manual}) → Promise(true si queda desat) */
N.desa = function(o){
  o = o || {};
  if(ST.timer){ clearTimeout(ST.timer); ST.timer = null; }
  if(ST.mode === "mirant"){ if(o.manual) N.toast("Estàs mirant la revisió de cuina: no es desa res."); return Promise.resolve(false); }
  if(ST.mode !== "projecte"){ if(o.manual) N.toast("Aquesta app no s'ha obert des d'un projecte: obre-la des del coordinador per desar."); return Promise.resolve(false); }
  if(!ST.permis){ if(o.manual) autoritzaCarpeta(); return Promise.resolve(false); }
  if(!ST.carregat){ if(o.manual) N.toast("Encara s'estan llegint les dades del disc; es desarà en acabar."); ST.pendent = true; return Promise.resolve(false); }   /* v1.2 */
  if(!N.brut() && !o.manual) return Promise.resolve(true);
  if(ST.desant){ ST.pendent = true; return Promise.resolve(false); }
  if(ST.nou && !ST.confirmat){
    if(o.auto && ST.preguntat) return Promise.resolve(false);
    ST.preguntat = true;
    return N.modal({titol:"Crear el projecte?",
      html:"Aquest projecte encara no té carpeta per a aquesta app.<br>Es crearà <b>" + esc(camiProjecte()) + "/</b> i, a partir d'aquí, es desarà sol.",
      botons:[{text:"Ara no", valor:false, cancel:true}, {text:"Crear i desar", valor:true, principal:true}]}).then(function(si){
      if(!si){ pintaEstat(); return false; }
      ST.confirmat = true; return N.desa({manual:true});
    });
  }
  var f0 = H.actual, nom = nomFitxer(N.IS_REV), text;
  try{ text = JSON.stringify(CFG.dades(ST.projecte), null, CFG.indent == null ? 2 : CFG.indent); }
  catch(e){ ST.error = "no s'han pogut preparar les dades: " + e.message; anotaError(ST.error, "", 0, 0, e.stack); pintaEstat(); return Promise.resolve(false); }
  if(CFG.xifrat && XF.estat === "bloquejat"){ if(o.manual) N.toast("Dades bloquejades: no es desa res."); return Promise.resolve(false); }   /* v1.3 */
  ST.desant = true; pintaEstat();
  var dirD = null;
  var pText = (CFG.xifrat && XF.mk && XF.estat === "obert") ? xfXifraText(text) : Promise.resolve(text);   /* v1.3: xifrar abans d'escriure */
  return pText.then(function(t){ text = t; return dirProjecte(true); }).then(function(d){ dirD = d; return F.escriuSegur(d, nom, text); }).then(function(){
    if(!CFG.alDesar) return;
    /* fitxers addicionals de l'app (p. ex. un traspàs a una altra app): si fallen, avís, però el desat principal és bo */
    return Promise.resolve().then(function(){ return CFG.alDesar(dirD, ST.projecte, N.IS_REV, !!o.manual); }).catch(function(e){
      anotaError("alDesar: " + (e && e.message), "", 0, 0, e && e.stack); N.toast("⚠ Desat, però un fitxer addicional ha fallat: " + (e && e.message), 6000); });
  }).then(function(){
    ST.desant = false; ST.error = null; ST.nou = false; ST.desatFoto = f0; ST.ultimDesat = horaCurta();
    if(!N.brut()) esborraRescat();
    if(o.manual) N.toast("Desat: " + nomCarpeta() + "/" + nom);
    pintaEstat();
    if(ST.pendent){ ST.pendent = false; programaDesat(); }
    return !N.brut();
  }, function(e){
    ST.desant = false; ST.error = e && e.message || String(e);
    anotaError("Desar: " + ST.error, "", 0, 0, e && e.stack);
    N.toast("⚠ No s'ha pogut desar: " + ST.error, 6000);
    pintaEstat(); return false;
  });
};

/* ═════════════ Carregar (amb la lògica de cuina / patrimoni) ═════════════ */
/* v1.3: asíncron — si el text és xifrat, primer es desxifra (pot demanar la contrasenya) */
function aplicaText(text){
  return xfDesxifraText(text).then(function(t){
    var obj = JSON.parse(t);
    N.carregant = true;
    try{ CFG.carrega(obj); } finally{ N.carregant = false; }
  });
}
/* On és el fitxer? Per defecte, el nom canònic a la carpeta de l'app; una app
   amb noms o carpetes antics dona cfg.cerca(nom, rev, arrel) → {dir, nom} | null. */
function cerca(rev){
  if(CFG.cerca) return Promise.resolve().then(function(){ return CFG.cerca(ST.projecte, rev, ST.arrel); }).catch(function(){ return null; });
  var n = nomFitxer(rev);
  return dirProjecte(false).then(function(d){ return F.existeix(d, n).then(function(hi){ return hi ? {dir:d, nom:n} : null; }); }, function(){ return null; });
}
function ambInfo(x){ return x ? F.info(x.dir, x.nom).then(function(i){ if(!i) return null; x.data = i.data; return x; }) : Promise.resolve(null); }
function carregaProjecte(){
  return Promise.all([cerca(false).then(ambInfo), cerca(true).then(ambInfo), dirProjecte(false).then(function(){ return true; }, function(){ return false; })]).then(function(r){
    var E = r[0], R = r[1], teCarpeta = r[2];
    if(!E && !R){
      ST.nou = !teCarpeta; fotoBase();
      if(ST.nou) N.toast(CFG.carpetaDades ? "Dades noves: es crearà " + camiProjecte() + "/" + nomFitxer(N.IS_REV) : "Projecte nou per a aquesta app: " + ST.projecte);
      /* alNou: l'app pot oferir un punt de partida (p. ex. el traspàs d'una altra app).
         Si retorna cert, el que carregui compta com a canvi de l'usuari (es desarà). */
      if(CFG.alNou) return Promise.resolve().then(function(){ return CFG.alNou(ST.projecte, ST.arrel); }).then(function(si){ if(si) fiCalma(); return null; }, function(){ return null; });
      return null;
    }
    if(N.IS_REV){
      var x = R || E;
      return F.llegeix(x.dir, x.nom).then(aplicaText).then(function(){ fotoBase();
        N.toast("Cuina: " + (R ? "carregada la revisió _rev" : "sense _rev encara; carregat l'estable (desarà al _rev)"));
        return x.data; });
    }
    if(!R) return F.llegeix(E.dir, E.nom).then(aplicaText).then(function(){ fotoBase(); return E.data; });
    return dialegRev(E, R);
  });
}
/* Patrimoni ha trobat una revisió de cuina: sempre el mateix diàleg, amb dates. */
function dialegRev(E, R){
  var mesNova = !E || R.data > E.data;
  return N.modal({titol:"Hi ha dades de la cuina",
    html:"Aquest projecte té una revisió feta amb l'app de <b>cuina</b>." +
      "<table><tr><td>Cuina (_rev)</td><td><b>" + esc(dataHora(R.data)) + "</b>" + (mesNova ? " · més nova" : "") + "</td></tr>" +
      "<tr><td>Patrimoni</td><td>" + (E ? esc(dataHora(E.data)) : "encara no n'hi ha") + "</td></tr></table>" +
      "<small>Mai s'esborra res: el que es deixa de fer servir es guarda a <i>antics/</i>.</small>",
    botons:[{text:"Mirar la de cuina", valor:"mirar"}, {text:"Mantenir la de patrimoni", valor:"mantenir", cancel:true},
            {text:"Adoptar les dades de cuina", valor:"adoptar", principal:true}]}).then(function(v){
    if(v === "adoptar"){
      var est = nomFitxer(false);
      return F.llegeix(R.dir, R.nom).then(function(t){
        return dirProjecte(true).then(function(d){
          /* l'estable anterior, a antics/ (si té un nom antic, surt de la carpeta) */
          var pas = E ? F.arxiva(E.dir, E.nom, E.nom !== est) : Promise.resolve();
          return pas.then(function(){ return F.escriuSegur(d, est, t); });
        }).then(function(){ return F.arxiva(R.dir, R.nom, true); })
          .then(function(){ return aplicaText(t); }).then(function(){ fotoBase(); N.toast("Dades de cuina adoptades (l'anterior és a antics/)"); return Date.now(); });
      });
    }
    if(v === "mirar"){
      return F.llegeix(R.dir, R.nom).then(aplicaText).then(function(){ fotoBase(); ST.mode = "mirant";
        cinta("mirant", "MIRANT LA CUINA · no es desa"); return null; });
    }
    return F.arxiva(R.dir, R.nom, true).then(function(){
      return E ? F.llegeix(E.dir, E.nom).then(aplicaText).then(function(){ fotoBase(); N.toast("S'ha mantingut patrimoni; la revisió de cuina és a antics/"); return E.data; })
               : (fotoBase(), null);
    });
  });
}

/* ═════════════ Carpeta ═════════════ */
function autoritzaCarpeta(){
  var p = ST.arrel ? F.permis(ST.arrel, true).then(function(ok){ return ok ? ST.arrel : F.triaArrel(); }) : F.triaArrel();
  return p.then(function(h){ ST.arrel = h; ST.permis = true; pintaEstat(); escriuErrors();
    if(ST.projecte && ST.mode === "projecte" && !ST.carregat) return obreProjecte(); }, function(e){ if(e && e.name !== "AbortError") N.toast("Carpeta: " + e.message); });
}
function obreProjecte(){
  XF._llegitXifrat = false;
  return xfPrepara().then(carregaProjecte).then(function(dataFitxer){   /* v1.3: contrasenya abans de llegir */
    ST.carregat = true; ST.pendent = false;
    if(CFG.alCarregar) try{ CFG.alCarregar(); }catch(e){ anotaError("alCarregar: " + e.message, "", 0, 0, e.stack); }
    pintaEstat(); pintaXf();
    var p = ST.mode === "projecte" ? mirarRescat(dataFitxer) : null;
    /* v1.3: protecció activa però el fitxer encara era en clar → es desa xifrat ara mateix */
    if(CFG.xifrat && XF.mk && XF.estat === "obert" && dataFitxer && !XF._llegitXifrat && ST.mode === "projecte")
      p = Promise.resolve(p).then(function(){ return N.desa({manual:true}); }).then(function(ok){ if(ok) N.toast("🔒 Dades desades xifrades.", 5000); });
    /* contrasenya treta però el fitxer encara era xifrat → es desa en clar ara mateix */
    else if(CFG.xifrat && XF.estat === "sense" && XF._llegitXifrat && dataFitxer && ST.mode === "projecte")
      p = Promise.resolve(p).then(function(){ return N.desa({manual:true}); }).then(function(ok){ if(ok) N.toast("🔓 Dades desades sense xifrar (la contrasenya s'havia tret).", 5000); });
    return p;
  }).catch(function(e){
    if(e && e.xfBloquejat){   /* v1.3: contrasenya no entrada → res es llegeix ni es desa */
      ST.error = "dades protegides: contrasenya no entrada"; XF.estat = "bloquejat"; pintaEstat(); pintaXf();
      N.modal({titol:"🔒 Dades bloquejades", html:"Sense la contrasenya no es mostren ni es desen les dades.<br>Torna a carregar la pàgina (F5) per tornar-ho a provar."});
      return;
    }
    anotaError("Carregar: " + (e && e.message), "", 0, 0, e && e.stack);
    N.toast("⚠ No s'ha pogut carregar el projecte: " + (e && e.message), 7000);
    ST.error = "no s'ha pogut llegir el fitxer del disc: no es desarà per no trepitjar-lo";   /* v1.2 */
    fotoBase(); pintaEstat();
  });
}

/* ═════════════ Tancar ═════════════ */
N.tanca = function(){
  return N.desa({auto:true}).then(function(){
    if(ST.mode === "projecte" && N.brut())
      return N.modal({titol:"Hi ha canvis sense desar", html:"Si tanques ara, es perdran els canvis que no s'han pogut desar.",
        botons:[{text:"Quedar-me", valor:false, cancel:true, principal:true}, {text:"Tancar igualment", valor:true}]});
    return true;
  }).then(function(tanca){
    if(!tanca) return;
    ST.sortint = true;
    location.replace(window.TMDBX.entrada); return;
    setTimeout(function(){
      if(window.closed) return;
      ST.sortint = false;
      N.modal({titol:"Tanca la pestanya", html:"El navegador no deixa tancar sola aquesta pestanya (no s'ha obert des del coordinador). Està tot desat: tanca-la a mà o " +
        '<a href="../../../sistema/coordinador.html">torna al coordinador</a>.'});
    }, 350);
  });
};
window.addEventListener("beforeunload", function(e){
  if(ST.sortint || ST.mode !== "projecte" || !N.brut()) return;
  escriuRescat(); e.preventDefault(); e.returnValue = ""; return "";
});
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "hidden" && N.brut()){ escriuRescat(); N.desa({auto:true}); } });
window.addEventListener("pagehide", function(){ if(N.brut()) escriuRescat(); });

/* ═════════════ Tecles ═════════════ */
function editable(el){ if(!el) return false; var t = (el.tagName || "").toLowerCase(); return t === "input" || t === "textarea" || t === "select" || el.isContentEditable; }
document.addEventListener("keydown", function(e){
  if(!CFG || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  var k = (e.key || "").toLowerCase();
  if(k === "s"){ e.preventDefault(); N.desa({manual:true}); return; }
  if(CFG.desfer === false || editable(e.target)) return;
  if(k === "z" && !e.shiftKey){ e.preventDefault(); N.desfes(); }
  else if(k === "y" || (k === "z" && e.shiftKey)){ e.preventDefault(); N.refes(); }
}, true);

/* ═════════════ Canal amb el coordinador ═════════════ */
var CANAL = null, _canalT = null;
try{ CANAL = new BroadcastChannel("panell"); }catch(e){}
function avisaCanal(){
  if(!CANAL || !CFG) return;
  if(_canalT) clearTimeout(_canalT);
  _canalT = setTimeout(function(){ try{ CANAL.postMessage({tipus:"estat", app:CFG.id, projecte:ST.projecte, rev:N.IS_REV, brut:N.brut(), mode:ST.mode}); }catch(e){} }, 300);
}
if(CANAL) CANAL.onmessage = function(ev){
  var m = ev.data || {};
  if(m.tipus === "desa-ara" && CFG){
    N.desa({auto:true}).then(function(){ try{ CANAL.postMessage({tipus:"desat", id:m.id, app:CFG.id, projecte:ST.projecte, ok:!N.brut()}); }catch(e){} });
  }
};

/* ═════════════ Registre de l'app ═════════════ */
/* PANELL.app({
     id, versio,                    identitat (APP_ID i versió de l'app)
     tipologia, subcarpeta,         projectes/<tipologia>/<NOM>/<subcarpeta>/
     carpetaDades, nomDades,        (v1.2, en lloc de l'anterior) app de DADES: dades/<…>/, sense ?projecte=
     historial, rescatPassos,       (v1.2, opcional) passos de desfer (100) i passos al rescat (30)
     fitxer(nom, rev),              nom del fitxer (per defecte <NOM>[_rev].json)
     dades(nom) → objecte,          el que es desa
     carrega(objecte),              posar a l'app el que s'ha llegit
     foto() / posaFoto(text),       (opcional) estat per desfer; per defecte, dades()
     desfer:false,                  (opcional) sense ↶ ↷
     capcalera:'selector',          la capçalera de l'app: la barra hi va SEMPRE com a primer element, amb ↶ ↷
                                    (barraDins de v1.0 hi equival; barraPos / barraAbans / barraDesfer ja no es fan servir)
     alEstat(estat),                (opcional) si l'app té els seus ↶ ↷, per pintar-los
     indent, alCarregar(), alDesfer(que), compat:true,
     nomProjecte(cru),              (opcional) com es normalitza el nom (p. ex. majúscules)
     alObrir(nom),                  (opcional) en obrir amb ?projecte= (p. ex. posar el nom al camp)
     dirProjecte(arrel, nom, crea), (opcional) carpeta de l'app si no és l'estàndard
     cerca(nom, rev, arrel),        (opcional) on és el fitxer si hi ha noms o carpetes antics → {dir, nom}
     alDesar(dir, nom, rev, manual),(opcional) fitxers addicionals després de desar (manual = 💾 / Ctrl+S)
     alNou(nom, arrel),             (opcional) projecte sense fitxer: punt de partida; cert = compta com a canvi
     compatExtra:{...} })           (opcional) més funcions per a window._projectsMgr */
N.app = function(cfg){
  if(CFG) throw new Error("PANELL.app() ja s'ha cridat");
  CFG = cfg;
  if(cfg.historial > 0) HISTO_MAX = cfg.historial;
  if(cfg.rescatPassos >= 0) RESCAT_PASSOS = cfg.rescatPassos;
  var cru = new URLSearchParams(location.search).get("projecte") || "";
  ST.projecte = N.nomNet(cfg.nomProjecte ? cfg.nomProjecte(cru) : cru);
  /* v1.2: app de DADES → sempre en mode projecte, amb un nom fix (per al rescat i el canal) */
  if(cfg.carpetaDades){ ST.projecte = N.nomNet(cfg.nomDades || cfg.id); ST.confirmat = true; }
  ST.mode = ST.projecte ? "projecte" : "lliure";
  if(cfg.compat !== false){
    window.saveProjectToFolder = function(){ return N.desa({manual:true}); };
    /* loadProjectFromText i setNomProjecte són d'ofici: si l'app ja en té, mana la seva */
    if(typeof window.loadProjectFromText !== "function") window.loadProjectFromText = function(t){ return aplicaText(t).then(function(){ fotoBase(); pintaEstat(); }); };
    if(typeof window.setNomProjecte !== "function") window.setNomProjecte = function(n){ ST.projecte = N.nomNet(n); };
    window.markDirty = function(){ N.canvi(); };
    window.markClean = function(){};
    window.showRevDialog = function(){ return N.toast("La revisió de cuina la gestiona el nucli en obrir el projecte."); };
    window._projectsMgr = {init:function(){ return Promise.resolve(); }, save:window.saveProjectToFolder, loadFromText:window.loadProjectFromText,
      setNom:window.setNomProjecte, hasRoot:function(){ return ST.mode === "projecte" && !!(ST.arrel && ST.permis); }, getRoot:function(){ return ST.arrel; },
      isDirty:function(){ return N.brut(); }, markDirty:function(){ N.canvi(); }, markClean:function(){}, getSubfolder:function(){ return cfg.subcarpeta; },
      suppress:function(fn){ var c = N.carregant; N.carregant = true; try{ fn(); } finally{ N.carregant = c; } },
      ensurePermission:function(h){ return F.permis(h, true); }, writeFile:F.escriu, fileExists:F.existeix,
      sanitizeProjectName:function(x){ return N.nomNet(cfg.nomProjecte ? cfg.nomProjecte(x) : x); }};
    if(cfg.compatExtra) for(var k in cfg.compatExtra) window._projectsMgr[k] = cfg.compatExtra[k];
  }
  var arrenca = function(){
    muntaBarra();
    if(ST.projecte && cfg.alObrir) try{ cfg.alObrir(ST.projecte); }catch(e){ anotaError("alObrir: " + e.message, "", 0, 0, e.stack); }
    fotoBase(); ST.iniciat = true; pintaEstat();
    F.recuperaArrel().then(function(h){
      ST.arrel = h || null;
      return F.permis(ST.arrel, false);
    }).then(function(ok){
      ST.permis = ok; pintaEstat();
      if(ok) escriuErrors();
      if(ST.mode !== "projecte") return;
      if(ok) return obreProjecte();
      N.toast(ST.arrel ? "Autoritza la carpeta PANELL (botó 📁) per obrir el projecte." : "Tria la carpeta PANELL (botó 📁) per obrir el projecte.", 7000);
    });
  };
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", arrenca); else arrenca();
};
N.estat = function(){ return {projecte:ST.projecte, mode:ST.mode, brut:N.brut(), permis:ST.permis, nou:ST.nou, desant:ST.desant, error:ST.error, passos:H.pila.length, refer:H.futur.length}; };
})();
/*==== FI NUCLI ====*/
</script>

.toast{ bottom:calc(16px + env(safe-area-inset-bottom)); }

function _diffLabel(prevS){ try{ var a=JSON.parse(prevS), b=state;
  if(b.moviments.length>a.moviments.length){ var ids={}; a.moviments.forEach(function(m){ids[m.id]=1;}); var n=b.moviments.filter(function(m){return !ids[m.id];})[0]; return "Nou moviment: "+(((n&&n.concepte)||"")+"").slice(0,30); }
  if(b.moviments.length<a.moviments.length){ var idsb={}; b.moviments.forEach(function(m){idsb[m.id]=1;}); var d0=a.moviments.filter(function(m){return !idsb[m.id];})[0]; return "Moviment esborrat: "+(((d0&&d0.concepte)||"")+"").slice(0,30); }
  var af={}; a.factures.forEach(function(f){af[f.id]=f;});
  for(var i=0;i<b.factures.length;i++){ var f=b.factures[i], o=af[f.id]; if(o){ if(o.estat!==f.estat) return "Factura "+f.num+": "+o.estat+" → "+f.estat; if((o.referencia||"")!==(f.referencia||"")) return "Factura "+f.num+": referència"; if(o.import!==f.import) return "Factura "+f.num+": import"; if((o.dataCobrament||"")!==(f.dataCobrament||"")) return "Factura "+f.num+": data de cobrament"; } }

function retencioDe(f){ if(!f || f.tipus!=="proveidor") return 0; var r=parseFloat(f.retencioIRPF); return (isNaN(r)||r<=0)?0:Math.round(r*100)/100; }

    var pp=f.tipus==="proveidor"&&f.estat!=="Pagada"&&f.estat!=="Compensada";

      // amb f.dataPrevista de les Reclamades, però ara per venciment.

    });

function saldaVenciment(f, idx, data, concepte, caixa, dte){

  if(_dx) m.dteDeduit=_dx;

function pagarFactura(f, data, concepte, caixa, dte){

function factsDeMoviment(m){ return (m.facturaIds && m.facturaIds.length)? m.facturaIds : (m.facturaId? [m.facturaId] : []); }
/* ---- Sincronització moviment↔factura: el moviment ha de reflectir l'import del seu venciment ----
   El moviment es crea al moment del cobrament/pagament amb l'import d'aleshores; si després es canvia
   l'import del venciment a Factures, el moviment NO se sincronitzava sol. Aquestes funcions ho arreglen. */
function importVencimentDe(f, mid){
  var _t=_importVencimentNominal(f, mid); if(_t==null) return null;
  var _mv=(state.moviments||[]).filter(function(x){ return x.id===mid; })[0];
  var _dx=(_mv && _mv.dteDeduit)?Math.abs(_mv.dteDeduit):0;   /* v1.20 · el moviment surt pel net pagat */

function _importVencimentNominal(f, mid){

function movDesajustatsFactura(f){

    if(!mv || mv.facturaId!==f.id) return;              // nomes moviments lligats a AQUESTA factura
    if(mv.facturaIds && mv.facturaIds.length) return;   // no toquem pagaments agrupats (remeses/rebuts)
    if(mv.tipus==="despesa") return;                    // no toquem despeses/comissions del rebut

  }

    if(mv.facturaIds && mv.facturaIds.length) return;             // rebuts/remeses agrupats: no

/* 05/10/2026 · v1.12 · HISTORIAL CLIENT/PROVEÏDOR d'un tercer, per avisar si una factura s'entra amb el

function ordreOptions(){
  var o=[["recent","Ordena: més recents"],["venciment","Ordena: venciment (futurs primer)"],["num","Ordena: número"],["import","Ordena: import"],["dataEmissio","Ordena: data emissió (antigues)"],["tercer","Ordena: tercer"]];
  return o.map(function(x){ return '<option value="'+x[0]+'" '+(filters.fOrdre===x[0]?"selected":"")+'>'+x[1]+'</option>'; }).join("");
}
function ordenador(camp){
  return function(a,b){
    if(camp==="recent"){ var ea=a.dataEmissio||"", eb=b.dataEmissio||""; if(ea!==eb) return ea<eb?1:-1; return (b.num||"").localeCompare(a.num||"", undefined, {numeric:true}); }
    if(camp==="num") return (a.num||"").localeCompare(b.num||"", undefined, {numeric:true});
    if(camp==="venciment"){ var wa=a.venciment||"", wb=b.venciment||""; if(wa!==wb) return wa<wb?1:-1; return 0; }
    if(camp==="import") return b.import-a.import;
    if(camp==="tercer") return (a.tercer||"").localeCompare(b.tercer||"");
    var va=a[camp]||"", vb=b[camp]||"";
    return va<vb?-1:va>vb?1:0;
  };
}

}

/* ============ Analítica ============ */
function faceMediana(fsA){
  var saldades=fsA.filter(function(f){return estatTancat(f)&&f.dataCobrament&&f.dataEmissio;});
  var difs=saldades.map(function(f){return Math.round((new Date(f.dataCobrament)-new Date(f.dataEmissio))/86400000);}).filter(function(d){return d>=-31 && d<=1000;});
  return difs.length? mediana(difs) : null;
}
// Calcula una "cara" (client o proveïdor) a partir de les seves factures i moviments solts.
function faceAgg(fsA, mvA){
  var totalFact=fsA.reduce(function(a,f){return a+f.import;},0);
  var pend=fsA.filter(function(f){return !estatTancat(f);}).reduce(function(a,f){return a+f.import;},0);
  var vencut=fsA.filter(function(f){ return !estatTancat(f)&&f.venciment&&daysDiff(f.venciment)<0; }).reduce(function(a,f){return a+f.import;},0);
  var totalMov=mvA.reduce(function(a,m){return a+m.import;},0);
  var ultimaF=fsA.map(function(f){return f.dataEmissio||"";}).sort().slice(-1)[0]||"";
  var ultimaM=mvA.map(function(m){return m.data||"";}).sort().slice(-1)[0]||"";
  return { fs:fsA, n:fsA.length, mvs:mvA, nMov:mvA.length, totalFact:totalFact, totalMov:totalMov, total:totalFact+totalMov, pend:pend, vencut:vencut, dies:faceMediana(fsA), ultima:(ultimaF>ultimaM?ultimaF:ultimaM)||null };
}
// ── Índexs per tercer (rendiment): agrupa factures i moviments per tercerId una sola
//    vegada, en lloc d'escanejar TOTES les factures/moviments per a cada tercer (evita O(N²)).
//    S'invaliden a save() (via _aggRefF=null), igual que _fIdx / _tIdx.
var _fByTerc=null,_mByTerc=null,_aggRefF=null,_aggRefM=null,_aggLenF=-1,_aggLenM=-1;
function _aggIdxOk(){
  var F=state.factures||[], M=state.moviments||[];
  if(_aggRefF===F && _aggRefM===M && _aggLenF===F.length && _aggLenM===M.length) return;
  _fByTerc=new Map(); _mByTerc=new Map();
  for(var i=0;i<F.length;i++){ var f=F[i]; if(f.tercerId==null) continue; var a=_fByTerc.get(f.tercerId); if(!a){ a=[]; _fByTerc.set(f.tercerId,a); } a.push(f); }
  for(var j=0;j<M.length;j++){ var m=M[j]; if(m.tercerId==null) continue; var b=_mByTerc.get(m.tercerId); if(!b){ b=[]; _mByTerc.set(m.tercerId,b); } b.push(m); }
  _aggRefF=F; _aggRefM=M; _aggLenF=F.length; _aggLenM=M.length;
}
function aggTercer(t){
  _aggIdxOk();
  var fs=_fByTerc.get(t.id)||[];
  // moviments propis del tercer (no venen de factura, per no duplicar)
  var mvs=(_mByTerc.get(t.id)||[]).filter(function(m){ return !m.facturaId && !(m.facturaIds&&m.facturaIds.length); });
  // Cara CLIENT: factures de client + moviments d'entrada (cobraments). Cara PROVEÏDOR: factures de proveïdor + moviments de sortida (pagaments).
  var cli=faceAgg(fs.filter(function(f){return f.tipus==="client";}),    mvs.filter(function(m){return (m.import||0)>=0;}));
  var prov=faceAgg(fs.filter(function(f){return f.tipus==="proveidor";}), mvs.filter(function(m){return (m.import||0)<0;}));
  var totalFact=fs.reduce(function(a,f){return a+f.import;},0);
  var totalMov=mvs.reduce(function(a,m){return a+m.import;},0);
  var ultima=((cli.ultima||"")>(prov.ultima||"")?cli.ultima:prov.ultima)||null;
  return {
    fs:fs, n:fs.length, mvs:mvs, nMov:mvs.length,
    totalFact:totalFact, totalMov:totalMov, total:totalFact+totalMov,
    pend:cli.pend+prov.pend, vencut:cli.vencut+prov.vencut,
    dies: t.tipus==="proveidor"? prov.dies : cli.dies, ultima:ultima,
    cli:cli, prov:prov, net:cli.pend-prov.pend
  };
}
function totalPerTipus(tipus){
  var tf=state.factures.filter(function(f){return f.tipus===tipus;}).reduce(function(a,f){return a+f.import;},0);
  var tm=0; state.moviments.forEach(function(m){ if(m.facturaId||(m.facturaIds&&m.facturaIds.length)||!m.tercerId) return; var t=findTercer(m.tercerId); if(t && (t.tipus===tipus||t.tipus==="ambdos")) tm+=Math.abs(m.import); });
  return tf+tm;
}
function mediana(arr){ if(!arr.length) return null; var s=arr.slice().sort(function(a,b){return a-b;}); var m=Math.floor(s.length/2); return s.length%2? s[m] : Math.round((s[m-1]+s[m])/2); }
/* 30/09/2026 · v1.10 · Una PROFORMA no és facturació: no suma enlloc del que és
   fiscal o estadístic (rànquings, famílies, gràfic mensual, «Facturat»). A
   tresoreria sí que hi és: es remesa i es cobra com qualsevol altra. */
function esProforma(f){ return !!(f && f.proforma); }
function baseFact(f){ if(esProforma(f)) return 0; return (f && f.base!=null)?f.base:((f&&f.import)||0); }
function facturacioMensual(){
  var m={};
  state.factures.forEach(function(f){ var k=(f.dataEmissio||"").slice(0,7); if(!k)return; if(!m[k])m[k]={client:0,proveidor:0}; if(m[k][f.tipus]!=null) m[k][f.tipus]+=baseFact(f); });
  return Object.keys(m).sort().map(function(k){ return {mes:k, client:m[k].client, proveidor:m[k].proveidor}; });
}

function modalRecalcIvaTercer(tid, regimSel){
  var t=findTercer(tid); if(!t) return;
  var regim=regimSel||t.regimIva||"general", pct=ivaPctRegim(regim);
  var fraccionades=0, senseTotal=0;
  var cands=[];
  (state.factures||[]).filter(function(f){ return f.tercerId===t.id; }).forEach(function(f){
    if(teVenciments(f)){ fraccionades++; return; }
    if(f.import==null){ senseTotal++; return; }
    var tot=f.import;
    var pctF=(f.ivaPct!=null)?f.ivaPct:pct;
    // Els suplerts (pagaments delegats) no porten IVA: se separen del total abans de repartir base i IVA.
    var supl=suplertsDe(f);
    var neta=Math.round((tot-supl)*100)/100;
    var nbase=Math.round((neta/(1+pctF/100))*100)/100;
    var niva=Math.round((neta-nbase)*100)/100;
    if(Math.abs(nbase-(f.base==null?neta:f.base))>=0.005 || Math.abs(niva-(f.iva||0))>=0.005) cands.push({f:f, nbase:nbase, niva:niva, tot:tot, supl:supl});
  });
  var regimTxt=({general:"General 21%",exportacio:"Exportació exempt 0%",importacio:"Importació exempt 0%",intracomunitari:"Intracomunitari 0%",reduit10:"Reduït 10%",reduit4:"Superreduït 4%"})[regim]||regim;
  var avisos='<p class="sub" style="margin-top:0">Règim: <strong>'+esc(regimTxt)+'</strong>. Es <strong>manté el Total</strong> de cada factura (el que hi ha al banc) i es recalculen la <strong>Base imponible</strong> i l\'<strong>IVA</strong>. Els <strong>suplerts</strong> (pagaments delegats, sense IVA) es descompten del total abans de repartir. No afecta el saldo de tresoreria.'+
    ((fraccionades||senseTotal)?' S\'ometen '+[fraccionades?fraccionades+' fraccionades':'',senseTotal?senseTotal+' sense import':''].filter(Boolean).join(' i ')+'.':'')+'</p>';
  if(!cands.length){
    openModal('<h3>Recalcular IVA · '+esc(t.nom)+'</h3><div class="body">'+avisos+'<div class="panel"><div class="sub" style="padding:14px"><strong>Cap factura per recalcular</strong> — o ja estan totes al dia amb aquest règim.</div></div></div><div class="foot"><button class="btn primary" data-close>Tancar</button></div>', {wide:true});
    return;
  }
  var rows=cands.map(function(x,i){ var f=x.f;
    return '<tr><td class="c"><input type="checkbox" data-ri="'+i+'" checked></td><td class="sub num">'+esc(String(f.num))+'</td><td class="c"><span class="badge '+estatDisplay(f).cls+'">'+estatDisplay(f).label+'</span></td>'+
      '<td class="r num">'+eur(x.tot)+(x.supl?'<br><span class="sub">− suplert '+eur(x.supl)+'</span>':'')+'</td>'+
      '<td class="r num sub">'+eur(f.base==null?0:f.base)+' → <strong>'+eur(x.nbase)+'</strong></td>'+
      '<td class="r num sub">'+eur(f.iva||0)+' → <strong>'+eur(x.niva)+'</strong></td></tr>';
  }).join("");
  openModal('<h3>Recalcular IVA · '+esc(t.nom)+'</h3><div class="body">'+avisos+
    '<div style="margin:6px 0"><button class="btn sm" id="ri-all">Marcar totes</button> <button class="btn sm" id="ri-none">Cap</button> <span class="sub">'+cands.length+' factures (Total fix, es recalcula Base i IVA)</span></div>'+
    '<div class="panel" style="max-height:52vh;overflow:auto"><table><thead><tr><th class="c"></th><th>Núm.</th><th class="c">Estat</th><th class="r">Total (fix)</th><th class="r">Base (abans → després)</th><th class="r">IVA (abans → després)</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div><div class="foot"><button class="btn ghost" data-close>Cancel·lar</button><button class="btn primary" id="ri-aplicar">Aplicar als seleccionats</button></div>', {wide:true});
  var _all=document.getElementById("ri-all"); if(_all) _all.onclick=function(){ Array.prototype.forEach.call(modal.querySelectorAll("[data-ri]"), function(cb){ cb.checked=true; }); };
  var _none=document.getElementById("ri-none"); if(_none) _none.onclick=function(){ Array.prototype.forEach.call(modal.querySelectorAll("[data-ri]"), function(cb){ cb.checked=false; }); };
  var _ap=document.getElementById("ri-aplicar"); if(_ap) _ap.onclick=function(){
    var n=0;
    Array.prototype.forEach.call(modal.querySelectorAll("[data-ri]"), function(cb){ if(cb.checked){ var x=cands[+cb.getAttribute("data-ri")], f=x.f; f.base=x.nbase; f.iva=x.niva; n++; } });
    t.regimIva=regim;
    save(); closeModal(); render(); toast(n+" factures recalculades (base i IVA)"); modalFitxaTercer(t.id);
  };
}
function comptaFacturesTercer(t){ return (state.factures||[]).filter(function(f){return f.tercerId===t.id || f.tercer===t.nom;}).length; }
function fusionarTercers(surv, loser){
  (state.factures||[]).forEach(function(f){ if(f.tercerId===loser.id || f.tercer===loser.nom){ f.tercer=surv.nom; f.tercerId=surv.id; } });
  (state.moviments||[]).forEach(function(m){ if(m.tercerId===loser.id){ m.tercerId=surv.id; if(m.tercerNom){ m.tercerNom=surv.nom; } } });
  ["nif","adreca","codiPostal","poblacio","provincia","pais","diesPagament","diesPagamentMes","formaPagament","contacte","notes"].forEach(function(k){
    if((surv[k]==null||surv[k]==="") && loser[k]!=null && loser[k]!=="") surv[k]=loser[k];
  });
  if((surv.regimIva==null||surv.regimIva===""||surv.regimIva==="general") && loser.regimIva && loser.regimIva!=="general") surv.regimIva=loser.regimIva;
  if(surv.tipus!==loser.tipus) surv.tipus="ambdos";
  var i=state.tercers.indexOf(loser); if(i>=0) state.tercers.splice(i,1);
  save();
}

function renderEstadistiques(){

  function barsChart(items,opts){ opts=opts||{}; var lv=4,max=0; items.forEach(function(it){ it.segments.forEach(function(s){ if(s.v>max)max=s.v; }); }); var top=niceTop(max||1),all=[]; items.forEach(function(it){ it.segments.forEach(function(s){ all.push(s.v); }); }); var avg=all.length?all.reduce(function(a,b){return a+b;},0)/all.length:0,grid=""; for(var i=0;i<=lv;i++){ grid+='<div class="gl" style="bottom:'+(100*i/lv)+'%"><span>'+shortEur(top*i/lv)+'</span></div>'; } var avgL=(opts.avg!==false&&avg>0)?'<div class="avgline" style="bottom:'+Math.min(99,100*avg/top)+'%"><span>mitjana '+shortEur(avg)+'</span></div>':''; var bars=items.map(function(it){ var seg=it.segments.map(function(s){ return '<div class="pcbar '+(s.cls||"")+'" style="height:'+Math.max(0.5,100*s.v/top)+'%" title="'+esc(s.title||"")+'"></div>'; }).join(""); return '<div class="pcb"><div class="pcbseg">'+seg+'</div><small title="'+esc(it.label)+'">'+esc(it.label)+'</small></div>'; }).join(""); return '<div class="pchart" style="height:'+(opts.height||230)+'px"><div class="plot">'+grid+avgL+'<div class="pbars">'+bars+'</div></div></div>'; }

function renderRemeses(){
  var h='<div class="toolbar"><div class="spacer"></div><span class="sub">Les remeses agrupen factures d\'un mateix client amb un venciment comú. Les cobrades es mantenen en gris com a històric.</span></div>';
  if(!state.remeses.length){ app.innerHTML=h+'<div class="panel"><div class="empty"><strong>Cap remesa</strong>Selecciona factures de client a Factures i crea\'n una.</div></div>'; return; }
  h+='<div class="panel"><table><thead><tr><th style="width:96px">Emissió</th><th>Remesa</th><th class="r" style="width:150px">Venciment</th><th style="width:120px">Entitat</th><th class="r" style="width:120px">Import</th><th class="c" style="width:96px">Cobrades</th><th style="width:210px"></th></tr></thead><tbody>';
  state.remeses.slice().sort(function(a,b){ var va=remVenciment(a)||"", vb=remVenciment(b)||""; return va<vb?1:va>vb?-1:0; }).forEach(function(r){
    var fs=r.factures.map(findFactura).filter(Boolean);
    var tot=fs.reduce(function(a,f){return a+f.import;},0);
    var cob=fs.filter(function(f){return f.estat==="Cobrada";}).length;
    var cobrada=fs.length>0 && cob===fs.length;
    var tercU=fs.map(function(f){return f.tercer;}).filter(function(v,i,a){return a.indexOf(v)===i;});
    var tercLabel = tercU.length===0?"—":(tercU.length===1?tercU[0]:(tercU.length<=2?tercU.join(", "):tercU.length+" tercers"));
    var nums=fs.map(function(f){return esc(f.num);}).join(", ");
    var venc=remVenciment(r);
    h+='<tr'+(cobrada?' class="remcob"':'')+' data-remesa="'+r.id+'" style="cursor:pointer'+(cobrada?';opacity:.5':'')+'" title="Veure les factures i tercers d\'aquesta remesa">'+
       '<td class="sub num">'+fdate(r.data)+'</td>'+
       '<td><span class="tercer">'+esc(tercLabel)+'</span><div class="sub">'+nums+'</div></td>'+
       '<td class="r num">'+(dataEditableTres(venc)?'<input type="date" class="cell-date" data-remvenc="'+r.id+'" value="'+esc(venc||"")+'" title="Editar el venciment comú (es propaga a les factures i a Tresoreria/Previsions/Resum)">':fdate(venc))+'</td>'+
       '<td class="sub">'+esc(r.entitat||"—")+'</td>'+
       '<td class="r num">'+eur(tot)+'</td>'+
       '<td class="c"><span class="badge '+(cobrada?"b-cobrada":"b-remesada")+'">'+cob+'/'+fs.length+'</span></td>'+
       '<td class="r"><div class="row-actions">'+(cob<fs.length?'<button class="btn sm primary" data-remcobrar="'+r.id+'">Cobrar</button>':'')+'<button class="btn sm ghost" data-remopen="'+r.id+'">Veure / Editar</button></div></td></tr>';
  });
  h+='</tbody></table></div>';

/* ============ Ajust manual del saldo (punteig del banc) ============ */
// Saldo acumulat fins a una data (inclosa): saldo inicial + tots els moviments amb data <= d.
function saldoFinsData(d){ var s=state.config.saldoInicial||0; var M=state.moviments||[]; for(var i=0;i<M.length;i++){ if(!esCaixa(M[i]) && !esPrevisio(M[i]) && (M[i].data||"")<=d) s+=(M[i].import||0); } return Math.round(s*100)/100; }
function modalAjustSaldo(){
  var hui=todayISO();
  var actual=saldoFinsData(hui);
  openModal('<h3>Ajustar el saldo de tresoreria</h3><div class="body">'+
    '<p class="sub" style="margin-top:0">Saldo calculat a data d\'avui: <strong>'+eur(actual)+'</strong>. Escriu el saldo <strong>real</strong> del banc i l\'app crearà un moviment d\'ajust visible per la diferència, de manera que el saldo quadri d\'aquesta data endavant. El pots desfer esborrant la línia d\'ajust.</p>'+
    '<div class="grid2">'+
      '<div class="field"><label>Saldo real del banc (€)</label><input id="aj-saldo" type="number" step="0.01" value="'+actual.toFixed(2)+'" autocomplete="off"></div>'+
      '<div class="field"><label>Data de l\'ajust</label><input id="aj-data" type="date" value="'+hui+'"></div>'+
    '</div>'+
    '<div class="field"><label>Motiu (opcional)</label><input id="aj-motiu" placeholder="p. ex. punteig de l\'extracte del banc" autocomplete="off"></div>'+
    '<div class="hint" id="aj-info" style="margin-top:4px"></div>'+
    '</div><div class="foot"><button class="btn ghost" data-close>Cancel·lar</button><button class="btn primary" id="aj-ok">Aplicar ajust</button></div>');
  var inp=document.getElementById("aj-saldo"), dataEl=document.getElementById("aj-data"), infoEl=document.getElementById("aj-info");
  function calcDelta(){ var real=parseFloat(inp.value); var d=dataEl.value||hui; if(isNaN(real)) return null; return { real:real, d:d, delta:Math.round((real-saldoFinsData(d))*100)/100 }; }
  function refresh(){ var r=calcDelta(); if(!r){ infoEl.textContent="Escriu el saldo real del banc."; return; } if(Math.abs(r.delta)<0.005){ infoEl.innerHTML='✓ El saldo ja quadra a aquesta data: no cal cap ajust.'; } else { infoEl.innerHTML='Es crearà un moviment d\'ajust de <strong>'+eur(r.delta)+'</strong> amb data '+fdate(r.d)+' perquè el saldo quadri.'; } }
  inp.addEventListener("input", refresh); dataEl.addEventListener("change", refresh); refresh();
  document.getElementById("aj-ok").onclick=function(){
    var r=calcDelta(); if(!r){ toast("Escriu el saldo real del banc"); return; }
    if(Math.abs(r.delta)<0.005){ toast("El saldo ja quadra"); closeModal(); return; }
    var motiu=(val("aj-motiu")||"").trim();

    if(!state.config.categories) state.config.categories=[];

    save(); closeModal(); render(); toast("Saldo ajustat a "+eur(r.real)+" (ajust de "+eur(r.delta)+")");
  };
}

// Detall dels moviments que sumen un import del Resum (per verificar), respectant el període (any/tot)
function detallMoviments(kind, cat, selYear){
  var inPer=function(m){ return selYear==="tot" || (m.data && m.data.slice(0,4)===selYear); };
  var tmap={}; state.tercers.forEach(function(t){ tmap[t.id]=t.nom; });
  var rows=state.moviments.filter(function(m){
    if(!inPer(m)) return false;
    if(kind==="cat") return m.tipus==="despesa" && !m.previst && ((m.categoria||"Altres")===cat);
    if(kind==="despeses") return m.tipus==="despesa" && !m.previst;
    if(kind==="cobraments") return m.tipus==="cobrament";
    if(kind==="altres") return m.tipus==="ingres";
    if(kind==="ingressos") return m.tipus==="cobrament"||m.tipus==="ingres";
    return false;
  });
  rows.sort(function(a,b){ return (a.data<b.data)?1:((a.data>b.data)?-1:0); });
  var tot=rows.reduce(function(s,m){ return s+Math.abs(m.import); },0);
  var titols={cat:"Despeses · "+(cat||""), despeses:"Total despeses", cobraments:"Ingressos per factures (cobraments)", altres:"Altres ingressos", ingressos:"Total ingressos"};
  var per=selYear==="tot" ? "tot l'històric" : ("any "+selYear);
  var showTipus=(kind==="ingressos");
  var body='<div class="body"><p class="sub" style="margin-top:0">'+per+' · <strong>'+rows.length+'</strong> moviments · suma <strong>'+eur(tot)+'</strong></p>'+
    '<div class="er-wrap"><table><thead><tr><th>Data</th><th>Concepte</th><th>Tercer</th>'+(showTipus?'<th>Origen</th>':'')+'<th class="r">Import</th></tr></thead><tbody>';
  if(!rows.length) body+='<tr><td colspan="'+(showTipus?5:4)+'" class="sub" style="padding:16px">Cap moviment en aquest període.</td></tr>';
  rows.forEach(function(m){
    var nom=(m.tercerId&&tmap[m.tercerId])?tmap[m.tercerId]:'';
    body+='<tr><td class="loccell num">'+fdate(m.data)+'</td><td>'+esc(m.concepte||'')+'</td><td>'+esc(nom)+'</td>'+
      (showTipus?'<td class="sub">'+(m.tipus==="cobrament"?"factura":"altre ingrés")+'</td>':'')+
      '<td class="r loccell num">'+eur(Math.abs(m.import))+'</td></tr>';
  });
  body+='</tbody></table></div>'+
    '<div style="text-align:right;font-weight:700;padding:10px 2px 0">Total: '+eur(tot)+'</div></div>';
  openModal('<h3>'+esc(titols[kind]||"Detall")+(selYear==="tot"?"":" · "+selYear)+'</h3>'+body+'<div class="foot"><button class="btn ghost" data-close>Tancar</button></div>', {wide:true});
}
